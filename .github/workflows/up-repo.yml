name: Generate APT Repository from Releases

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: "GitHub repo that hosts the release tags (owner/name)"
        required: true
        default: "xodiosx/termux-packages"
      hf_repo_id:
        description: "Hugging Face dataset repo where .deb files live (username/repo-name)"
        required: true
        default: "xodiosx/xodos-packages"
      tags:
        description: "Space/comma separated tags. Leave empty to auto-discover."
        required: false
        default: ""
      repos:
        description: "Comma-separated repos to auto-discover."
        required: false
        default: "main,x11,root,glibc"
      keep_old:
        description: "Keep existing metadata in docs/xodos-*/"
        type: boolean
        default: true
      push_batch_size:
        description: "Files per git push batch"
        required: false
        default: "150"
      max_deb_mb:
        description: "Skip .deb files larger than this. 0 = reference ALL .deb by URL (recommended for HF hosting)"
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: generate-repo
  cancel-in-progress: false

jobs:
  generate-repo:
    runs-on: ubuntu-24.04
    steps:

    - name: Checkout repository (Pages repo)
      uses: actions/checkout@v6
      with:
        fetch-depth: 1
        ref: master

    - name: Install tools
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq dpkg-dev apt-utils xz-utils zstd jq

    - name: Ensure .gitattributes protects binary files
      run: |
        if [ ! -f .gitattributes ]; then
          printf '%s\n' \
            '*.deb binary' \
            '*.ddeb binary' \
            '*.gz binary' \
            '*.xz binary' \
            '*.zst binary' \
            '*.tar binary' \
            '*.zip binary' \
            '*.png binary' \
            '*.jpg binary' \
            '*.jpeg binary' \
            '*.gif binary' \
            '*.ico binary' \
            '*.so binary' \
            '*.a binary' \
            '*.o binary' \
            '*.woff binary' \
            '*.woff2 binary' \
            '*.ttf binary' \
            '*.otf binary' \
            '*.pdf binary' > .gitattributes
        else
          grep -q '^\s*\*\.deb binary' .gitattributes || echo '*.deb binary' >> .gitattributes
          grep -q '^\s*\*\.gz binary'  .gitattributes || echo '*.gz binary'  >> .gitattributes
          grep -q '^\s*\*\.xz binary'  .gitattributes || echo '*.xz binary'  >> .gitattributes
        fi
        cat .gitattributes

    # ==================================================================
    # 1. Resolve tags
    # ==================================================================
    - name: Resolve tags
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SRC: ${{ inputs.source_repo }}
        INPUT_TAGS: ${{ inputs.tags }}
        INPUT_REPOS: ${{ inputs.repos }}
      run: |
        set -euo pipefail
        mkdir -p /tmp/plan
        : > /tmp/plan/tags.txt
        echo ">>> Source repo for releases: $SRC"

        if [ -n "$INPUT_TAGS" ]; then
          TAGS_RAW="${INPUT_TAGS//,/ }"
          read -a TAGS <<< "$TAGS_RAW"
          printf '%s\n' "${TAGS[@]}" > /tmp/plan/tags.txt
          echo ">>> User-provided tags (${#TAGS[@]}):"
          printf '    %s\n' "${TAGS[@]}"
        else
          echo ">>> Auto-discovering tags in $SRC for repos: $INPUT_REPOS"
          REPOS_ALT=$(echo "$INPUT_REPOS" | tr ',' '|')
          gh release list --repo "$SRC" --limit 1000 \
            --json tagName,createdAt \
            --jq "sort_by(.createdAt) | .[].tagName | select(test(\"^xodos-XoDos-(${REPOS_ALT})-p[0-9]+-\"))" \
            > /tmp/plan/tags.txt
          if [ ! -s /tmp/plan/tags.txt ]; then
            echo "::error::No matching tags found in $SRC."
            gh release list --repo "$SRC" --limit 30 || true
            exit 1
          fi
          echo ">>> Auto-discovered $(wc -l < /tmp/plan/tags.txt) tag(s):"
          sed 's/^/    /' /tmp/plan/tags.txt
        fi

    # ==================================================================
    # 2. Parse + group tags
    # ==================================================================
    - name: Parse and group tags by repo
      run: |
        set -euo pipefail
        : > /tmp/plan/groups.txt
        while IFS= read -r tag; do
          [ -z "$tag" ] && continue
          case "$tag" in
            xodos-XoDos-main-p*)  printf 'main\t%s\n'  "$tag" >> /tmp/plan/groups.txt ;;
            xodos-XoDos-x11-p*)   printf 'x11\t%s\n'   "$tag" >> /tmp/plan/groups.txt ;;
            xodos-XoDos-root-p*)  printf 'root\t%s\n'  "$tag" >> /tmp/plan/groups.txt ;;
            xodos-XoDos-glibc-p*) printf 'glibc\t%s\n' "$tag" >> /tmp/plan/groups.txt ;;
            *) echo ">>> WARNING: unparsed tag: $tag" ;;
          esac
        done < /tmp/plan/tags.txt

        if [ ! -s /tmp/plan/groups.txt ]; then
          echo "::error::No tags could be parsed"
          exit 1
        fi

        echo ">>> Full mapping:"
        sort /tmp/plan/groups.txt | sed 's/^/    /'
        cut -f1 /tmp/plan/groups.txt | sort -u > /tmp/plan/repos.txt
        echo ">>> Repos present:"
        sed 's/^/    /' /tmp/plan/repos.txt

    # ==================================================================
    # 3. Download all .deb from all parts of all repos
    # ==================================================================
    - name: Download .deb files from all parts
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SRC: ${{ inputs.source_repo }}
      run: |
        set -euo pipefail
        rm -rf /tmp/raw-debs
        mkdir -p /tmp/raw-debs
        : > /tmp/deb-tags.tsv

        while IFS= read -r repo; do
          [ -z "$repo" ] && continue
          echo "=================================================="
          echo ">>> repo: $repo"
          echo "=================================================="
          mkdir -p "/tmp/raw-debs/$repo"

          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            echo ">>> downloading from tag: $tag"
            tmpdir=$(mktemp -d)
            if ! gh release download "$tag" --repo "$SRC" \
                   --pattern "*.deb" --dir "$tmpdir" 2>/tmp/dl_err.log
            then
              echo ">>> WARN: download failed for $tag"
              head -5 /tmp/dl_err.log | sed 's/^/    /' || true
              rm -rf "$tmpdir"
              continue
            fi
            n=$(find "$tmpdir" -maxdepth 1 -type f -name '*.deb' | wc -l)
            echo "    downloaded $n .deb file(s)"
            while IFS= read -r -d '' deb; do
              printf '%s\t%s\n' "$(basename "$deb")" "$tag" >> /tmp/deb-tags.tsv
            done < <(find "$tmpdir" -maxdepth 1 -type f -name '*.deb' -print0)
            find "$tmpdir" -maxdepth 1 -type f -name '*.deb' -print0 \
              | xargs -0r mv -t "/tmp/raw-debs/$repo/"
            rm -rf "$tmpdir"
          done < <(grep -P "^${repo}\t" /tmp/plan/groups.txt | cut -f2)

          total=$(find "/tmp/raw-debs/$repo" -maxdepth 1 -type f -name '*.deb' | wc -l)
          echo ">>> repo $repo: $total .deb file(s)"
        done < /tmp/plan/repos.txt

    # ==================================================================
    # 4. Build pool — with max_deb_mb=0 (default), every .deb is
    #    referenced by Hugging Face URL and NOTHING lands in pool/.
    # ==================================================================
    - name: Build per-repo pool
      env:
        MAX_DEB_MB: ${{ inputs.max_deb_mb }}
        HF_REPO: ${{ inputs.hf_repo_id }}
      run: |
        set -euo pipefail

        MAX_BYTES=$(( ${MAX_DEB_MB:-0} * 1024 * 1024 ))
        echo ">>> max_deb_mb=${MAX_DEB_MB}  ($MAX_BYTES bytes)"
        echo ">>> HF repo for external .deb URLs: $HF_REPO"

        : > /tmp/large-external.tsv

        while IFS= read -r repo; do
          [ -z "$repo" ] && continue
          case "$repo" in
            main)  dist=stable; comp=main ;;
            x11)   dist=x11;    comp=main ;;
            root)  dist=root;   comp=stable ;;
            glibc) dist=glibc;  comp=main ;;
            *)     echo ">>> SKIP unknown repo: $repo"; continue ;;
          esac

          echo "=================================================="
          echo ">>> processing repo: $repo  (dist=$dist comp=$comp)"
          echo "=================================================="

          outdir="docs/xodos-${repo}"
          pooldir="${outdir}/pool/${comp}"

          if [ "${{ inputs.keep_old }}" != "true" ]; then
            echo ">>> keep_old=false — wiping ${outdir}"
            rm -rf "$outdir"
          fi
          mkdir -p "$pooldir"
          touch "${pooldir}/.gitkeep"

          tsv="/tmp/all-${repo}.tsv"
          : > "$tsv"
          valid=0
          invalid=0
          shopt -s nullglob
          for deb in /tmp/raw-debs/"$repo"/*.deb; do
            if ! dpkg-deb -I "$deb" >/dev/null 2>&1; then
              echo ">>> SKIP invalid: $(basename "$deb")"
              invalid=$((invalid + 1))
              continue
            fi
            pkg=$(dpkg-deb -f "$deb" Package)
            ver=$(dpkg-deb -f "$deb" Version)
            size=$(stat -c %s "$deb")
            printf '%s\t%s\t%s\t%s\n' "$pkg" "$ver" "$size" "$deb" >> "$tsv"
            valid=$((valid + 1))
          done
          shopt -u nullglob
          echo ">>> valid=${valid} invalid=${invalid}"

          winners="/tmp/winners-${repo}.tsv"
          sort -t$'\t' -k1,1 -k2,2rV "$tsv" | awk -F'\t' '!seen[$1]++' > "$winners"

          placed=0
          skipped_large=0
          while IFS=$'\t' read -r pkg ver size path; do
            [ -z "$pkg" ] && continue

            # If max_deb_mb=0, all files are external
            # Else, only files > MAX_BYTES are external
            if [ "$MAX_BYTES" -eq 0 ] || [ "$size" -gt "$MAX_BYTES" ]; then
              fname=$(basename "$path")
              url="https://huggingface.co/datasets/${HF_REPO}/resolve/main/${fname}"
              if [ "$MAX_BYTES" -gt 0 ]; then
                mb=$(( size / 1024 / 1024 ))
                echo ">>> LARGE (${mb} MB): $pkg -> $url"
              fi
              printf '%s\t%s\n' "$pkg" "$url" >> /tmp/large-external.tsv
              skipped_large=$((skipped_large + 1))
              continue
            fi

            first_letter=$(printf '%s' "$pkg" | cut -c1 | tr 'A-Z' 'a-z')
            dest_dir="${pooldir}/${first_letter}/${pkg}"
            mkdir -p "$dest_dir"
            rm -f "$dest_dir"/"${pkg}"_*.deb 2>/dev/null || true
            cp -a "$path" "$dest_dir/"
            placed=$((placed + 1))
          done < "$winners"

          echo ">>> placed ${placed} in pool, ${skipped_large} external (HF)"
        done < /tmp/plan/repos.txt

        echo ""
        echo ">>> total external (HF): $(wc -l < /tmp/large-external.tsv)"

    # ==================================================================
    # 5. Generate Packages indexes with HF URLs in Filename:
    #
    # We do it differently from before: run dpkg-scanpackages on an
    # empty pool (or the real one if max_deb_mb>0), then inject the
    # external entries ourselves. This avoids relying on the pool
    # containing the .deb files at all.
    #
    # Simpler approach: we still call dpkg-scanpackages on whatever
    # landed in pool/, then rewrite Filename for external ones via awk.
    # ==================================================================
    - name: Generate Packages indexes
      env:
        HF_REPO: ${{ inputs.hf_repo_id }}
        MAX_DEB_MB: ${{ inputs.max_deb_mb }}
      run: |
        set -euo pipefail
        : > /tmp/override.empty

        while IFS= read -r repo; do
          [ -z "$repo" ] && continue
          case "$repo" in
            main)  dist=stable; comp=main ;;
            x11)   dist=x11;    comp=main ;;
            root)  dist=root;   comp=stable ;;
            glibc) dist=glibc;  comp=main ;;
            *)     continue ;;
          esac

          outdir="docs/xodos-${repo}"
          echo ">>> repo: $repo  (dist=$dist comp=$comp)"
          rm -rf "${outdir}/dists"
          mkdir -p "${outdir}/dists/${dist}/${comp}/binary-aarch64"
          mkdir -p "${outdir}/dists/${dist}/${comp}/binary-all"

          cd "$outdir"
          dpkg-scanpackages --multiversion "pool/${comp}" /tmp/override.empty \
            > "dists/${dist}/${comp}/binary-aarch64/Packages"
          dpkg-scanpackages --multiversion --arch all "pool/${comp}" /tmp/override.empty \
            > "dists/${dist}/${comp}/binary-all/Packages"
          cd - >/dev/null

          # If max_deb_mb=0 the pool is empty, so we need to build the
          # Packages file entirely from the external URL list. Otherwise
          # we only rewrite the entries that are external.
          if [ "$MAX_DEB_MB" = "0" ] && [ -s /tmp/large-external.tsv ]; then
            echo ">>> max_deb_mb=0 — building Packages from HF URL list"
            # Build full Packages entries from scratch using dpkg-deb
            # on the raw .deb files, then substitute Filename with HF URL.
            for arch in aarch64 all; do
              out_pkgs="${outdir}/dists/${dist}/${comp}/binary-${arch}/Packages"
              : > "$out_pkgs"
              while IFS=$'\t' read -r pkg url; do
                # Find the raw .deb for this pkg + arch
                match=""
                for d in /tmp/raw-debs/"$repo"/*.deb; do
                  [ -f "$d" ] || continue
                  p=$(dpkg-deb -f "$d" Package 2>/dev/null || echo "")
                  a=$(dpkg-deb -f "$d" Architecture 2>/dev/null || echo "")
                  if [ "$p" = "$pkg" ]; then
                    if [ "$arch" = "all" ] && [ "$a" = "all" ]; then match="$d"; break; fi
                    if [ "$arch" = "aarch64" ] && { [ "$a" = "aarch64" ] || [ "$a" = "all" ]; }; then match="$d"; break; fi
                  fi
                done
                [ -z "$match" ] && continue

                # Emit Package fields, then override Filename
                dpkg-deb -f "$match" \
                  | awk -v url="$url" '
                      /^Package:/       { print; next }
                      /^Version:/       { print; next }
                      /^Architecture:/  { print; next }
                      /^Maintainer:/    { print; next }
                      /^Installed-Size:/ { print; next }
                      /^Depends:/       { print; next }
                      /^Recommends:/    { print; next }
                      /^Suggests:/      { print; next }
                      /^Conflicts:/     { print; next }
                      /^Replaces:/      { print; next }
                      /^Provides:/      { print; next }
                      /^Breaks:/        { print; next }
                      /^Section:/       { print; next }
                      /^Priority:/      { print; next }
                      /^Homepage:/      { print; next }
                      /^Description:/   { print; next }
                      /^Essential:/     { print; next }
                      /^Multi-Arch:/    { print; next }
                    ' >> "$out_pkgs"

                # Append Filename + Size + checksums from the raw .deb
                fsize=$(stat -c %s "$match")
                md5=$(md5sum "$match" | awk '{print $1}')
                sha1=$(sha1sum "$match" | awk '{print $1}')
                sha256=$(sha256sum "$match" | awk '{print $1}')
                {
                  echo "Filename: $url"
                  echo "Size: $fsize"
                  echo "MD5sum: $md5"
                  echo "SHA1: $sha1"
                  echo "SHA256: $sha256"
                  echo ""
                } >> "$out_pkgs"
              done < /tmp/large-external.tsv

              # Deduplicate by package name (keep highest version)
              # Group entries, sort, keep first per Package
              python3 - "$out_pkgs" << 'PYEOF'
import sys, re
p = sys.argv[1]
text = open(p).read()
blocks = [b.strip() for b in text.split("\n\n") if b.strip()]
seen = {}
for b in blocks:
    m = re.search(r'^Package:\s*(\S+)', b, re.M)
    if not m: continue
    pkg = m.group(1)
    if pkg not in seen:
        seen[pkg] = b
open(p, "w").write("\n\n".join(seen.values()) + "\n")
PYEOF

              echo "    binary-${arch}: $(grep -c '^Package:' "$out_pkgs" || true) entries"
            done
          else
            # Only rewrite Filename for external packages
            if [ -s /tmp/large-external.tsv ]; then
              for arch in aarch64 all; do
                f="${outdir}/dists/${dist}/${comp}/binary-${arch}/Packages"
                if [ ! -f "$f" ]; then continue; fi
                awk -F'\t' '
                  NR==FNR { url[$1]=$2; next }
                  /^Package: / { pkg=substr($0,10); print; next }
                  /^Filename: / && (pkg in url) { print "Filename: " url[pkg]; next }
                  { print }
                ' /tmp/large-external.tsv "$f" > "${f}.new"
                mv "${f}.new" "$f"
              done
            fi
          fi

          echo "    aarch64:    $(grep -c '^Package:' "${outdir}/dists/${dist}/${comp}/binary-aarch64/Packages" || true)"
          echo "    binary-all: $(grep -c '^Package:' "${outdir}/dists/${dist}/${comp}/binary-all/Packages" || true)"
        done < /tmp/plan/repos.txt

    # ==================================================================
    # 6. Compress with gzip only
    # ==================================================================
    - name: Compress Packages indexes
      run: |
        set -euo pipefail
        while IFS= read -r repo; do
          [ -z "$repo" ] && continue
          case "$repo" in
            main)  dist=stable; comp=main ;;
            x11)   dist=x11;    comp=main ;;
            root)  dist=root;   comp=stable ;;
            glibc) dist=glibc;  comp=main ;;
            *)     continue ;;
          esac
          for arch in aarch64 all; do
            f="docs/xodos-${repo}/dists/${dist}/${comp}/binary-${arch}/Packages"
            if [ ! -f "$f" ]; then continue; fi
            gzip -kf -9 "$f"
            rm -f "$f.xz"
          done
        done < /tmp/plan/repos.txt

    # ==================================================================
    # 7. Release files (no heredoc)
    # ==================================================================
    - name: Generate Release files
      run: |
        set -euo pipefail
        while IFS= read -r repo; do
          [ -z "$repo" ] && continue
          case "$repo" in
            main)  dist=stable; comp=main;   label="xodos Termux main" ;;
            x11)   dist=x11;    comp=main;   label="xodos Termux x11" ;;
            root)  dist=root;   comp=stable; label="xodos Termux root" ;;
            glibc) dist=glibc;  comp=main;   label="xodos Termux glibc" ;;
            *)     continue ;;
          esac

          conf="/tmp/apt-ftparchive-${repo}.conf"
          {
            echo 'APT::FTPArchive::Release::Origin "xodos";'
            echo "APT::FTPArchive::Release::Label \"${label}\";"
            echo "APT::FTPArchive::Release::Suite \"${dist}\";"
            echo "APT::FTPArchive::Release::Codename \"${dist}\";"
            echo 'APT::FTPArchive::Release::Architectures "aarch64 all";'
            echo "APT::FTPArchive::Release::Components \"${comp}\";"
            echo "APT::FTPArchive::Release::Description \"xodos custom Termux ${repo} packages\";"
          } > "$conf"

          cd "docs/xodos-${repo}"
          apt-ftparchive -c "$conf" release "dists/${dist}" > "dists/${dist}/Release"
          cp "dists/${dist}/Release" "dists/${dist}/InRelease"
          cd - >/dev/null
          echo ">>> xodos-${repo}: Release written"
        done < /tmp/plan/repos.txt

    # ==================================================================
    # 8. Sanity check
    # ==================================================================
    - name: Verify repo layout
      run: |
        set -euo pipefail
        fail=0
        while IFS= read -r repo; do
          [ -z "$repo" ] && continue
          pkg_file=$(find "docs/xodos-${repo}/dists" -type f -name 'Packages' | head -1)
          if [ -z "$pkg_file" ]; then
            echo "::error::No Packages for xodos-${repo}"
            fail=$((fail+1))
            continue
          fi

          good=0
          bad=0
          while IFS= read -r line; do
            case "$line" in
              Filename:\ https://*) good=$((good+1)) ;;
              Filename:\ pool/*)    good=$((good+1)) ;;
              Filename:\ *)         echo "  BAD: $line"; bad=$((bad+1)) ;;
            esac
          done < <(grep '^Filename:' "$pkg_file" || true)

          if [ "$bad" -gt 0 ]; then
            echo "::error::$bad bad Filename entries in $repo"
            fail=$((fail+1))
          fi

          rel_file=$(find "docs/xodos-${repo}/dists" -type f -name 'Release' | head -1)
          if [ -z "$rel_file" ]; then
            echo "::error::No Release for $repo"
            fail=$((fail+1))
          fi

          ndeb=$(find "docs/xodos-${repo}/pool" -type f -name '*.deb' 2>/dev/null | wc -l)
          echo "  xodos-${repo}: $good Filename entries ($ndeb .deb in pool)"
        done < /tmp/plan/repos.txt

        if [ "$fail" -gt 0 ]; then
          exit 1
        fi

        echo ""
        echo ">>> docs/ total size:"
        du -sh docs/ 2>/dev/null || true
        echo ""
        echo ">>> externally-referenced .deb files: $(wc -l < /tmp/large-external.tsv)"

    # ==================================================================
    # 9. Commit + push in chunks
    # ==================================================================
    - name: Commit & push docs (chunked)
      env:
        BATCH_SIZE: ${{ inputs.push_batch_size }}
      run: |
        set -uo pipefail
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git config http.postBuffer 524288000
        git config http.lowSpeedLimit 0
        git config http.lowSpeedTime 999999

        git add -A docs/ .gitattributes
        git diff --cached --name-only > /tmp/changed-files.txt || true
        total=$(wc -l < /tmp/changed-files.txt)
        echo ">>> total changed files: $total"
        if [ "$total" -eq 0 ]; then
          echo ">>> no changes — nothing to push"
          exit 0
        fi
        git reset -q

        BATCH="${BATCH_SIZE:-150}"
        case "$BATCH" in
          ''|*[!0-9]*) BATCH=150 ;;
        esac
        if [ "$BATCH" -lt 20 ]; then BATCH=20; fi

        batches=$(( (total + BATCH - 1) / BATCH ))
        echo ">>> pushing in $batches batch(es) of $BATCH"

        push_with_retry() {
          local attempt
          for attempt in 1 2 3 4 5; do
            echo "    push attempt $attempt/5 ..."
            if git push origin HEAD 2>/tmp/push_err.log; then
              echo "    push ok"
              return 0
            fi
            tail -5 /tmp/push_err.log | sed 's/^/        /' || true
            if grep -q 'GH001\|exceeds GitHub.s file size limit\|pre-receive hook declined' /tmp/push_err.log; then
              echo "::error::GitHub rejected push for a hard reason"
              return 1
            fi
            sleep $((attempt * 15))
          done
          return 1
        }

        i=0
        batch_num=0
        while [ "$i" -lt "$total" ]; do
          batch_num=$(( batch_num + 1 ))
          end=$(( i + BATCH ))
          if [ "$end" -gt "$total" ]; then end=$total; fi
          echo ">>> batch $batch_num/$batches (files $((i+1))..$end)"
          sed -n "$((i+1)),${end}p" /tmp/changed-files.txt > /tmp/batch-list.txt
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            git add -- "$f" 2>/dev/null || true
          done < /tmp/batch-list.txt

          if git diff --cached --quiet; then
            echo "    nothing staged — skipping"
            i=$end
            continue
          fi

          git commit -q -m "Update APT repository (batch $batch_num/$batches) [skip ci]" \
            -m "Source: ${{ inputs.source_repo }}  HF: ${{ inputs.hf_repo_id }}" || {
              echo "::error::commit failed for batch $batch_num"
              exit 1
            }
          if ! push_with_retry; then
            echo "::error::push failed for batch $batch_num"
            exit 1
          fi
          i=$end
        done
        echo ">>> all batches pushed"

    - name: Summary
      run: |
        {
          echo "## APT Repositories Generated"
          echo ""
          echo "Source repo: \`${{ inputs.source_repo }}\`"
          echo "HF dataset: \`${{ inputs.hf_repo_id }}\`"
          echo ""
          echo "Base URL for metadata: \`https://xodiosx.github.io/Termux-pkg-x/\`"
          echo "Base URL for .deb:      \`https://huggingface.co/datasets/${{ inputs.hf_repo_id }}/resolve/main/\`"
          echo ""
          echo "### sources.list"
          echo '```'
          while IFS= read -r repo; do
            [ -z "$repo" ] && continue
            case "$repo" in
              main)  d=stable; c=main ;;
              x11)   d=x11;    c=main ;;
              root)  d=root;   c=stable ;;
              glibc) d=glibc;  c=main ;;
              *)     continue ;;
            esac
            echo "deb [trusted=yes] https://xodiosx.github.io/Termux-pkg-x/xodos-${repo} ${d} ${c}"
          done < /tmp/plan/repos.txt
