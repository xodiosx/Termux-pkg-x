name: Generate APT Metadata on Hugging Face

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: "GitHub repo that hosts release tags (owner/name)"
        required: true
        default: "xodiosx/termux-packages"
      hf_repo_id:
        description: "Hugging Face dataset repo (username/repo-name)"
        required: true
        default: "xodiosx/xodos-packages"
      tags:
        description: "Space/comma tags. Empty = auto-discover xodos-XoDos-* tags."
        required: false
        default: ""
      repos:
        description: "Sub-repos to include (comma-separated)"
        required: false
        default: "main,x11,root,glibc"

permissions:
  contents: read

jobs:
  generate-metadata:
    runs-on: ubuntu-24.04
    steps:

    - name: Install tools
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq dpkg-dev apt-utils gzip jq
        pip install -q --upgrade "huggingface_hub[cli]<1.0"

    # ==================================================================
    # 1. Resolve tags + group by repo
    # ==================================================================
    - name: Resolve and group tags
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SRC: ${{ inputs.source_repo }}
        INPUT_TAGS: ${{ inputs.tags }}
        INPUT_REPOS: ${{ inputs.repos }}
      run: |
        set -euo pipefail
        mkdir -p /tmp/plan
        : > /tmp/plan/groups.txt

        if [ -n "$INPUT_TAGS" ]; then
          read -a TAGS <<< "${INPUT_TAGS//,/ }"
        else
          REPOS_ALT=$(echo "$INPUT_REPOS" | tr ',' '|')
          mapfile -t TAGS < <(
            gh release list --repo "$SRC" --limit 1000 \
              --json tagName,createdAt \
              --jq "sort_by(.createdAt) | .[].tagName | select(test(\"^xodos-XoDos-(${REPOS_ALT})-p[0-9]+-\"))"
          )
        fi

        if [ "${#TAGS[@]}" -eq 0 ]; then
          echo "::error::No tags found"
          exit 1
        fi

        for tag in "${TAGS[@]}"; do
          case "$tag" in
            xodos-XoDos-main-p*)  printf 'main\t%s\n'  "$tag" >> /tmp/plan/groups.txt ;;
            xodos-XoDos-x11-p*)   printf 'x11\t%s\n'   "$tag" >> /tmp/plan/groups.txt ;;
            xodos-XoDos-root-p*)  printf 'root\t%s\n'  "$tag" >> /tmp/plan/groups.txt ;;
            xodos-XoDos-glibc-p*) printf 'glibc\t%s\n' "$tag" >> /tmp/plan/groups.txt ;;
          esac
        done

        cut -f1 /tmp/plan/groups.txt | sort -u > /tmp/plan/repos.txt
        echo ">>> Repos:"
        sed 's/^/    /' /tmp/plan/repos.txt

    # ==================================================================
    # 2. Download .deb files from GitHub — ONLY for reading metadata.
    #    They are NOT uploaded to Hugging Face.
    # ==================================================================
    - name: Download .deb from GitHub (metadata only)
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SRC: ${{ inputs.source_repo }}
      run: |
        set -euo pipefail
        rm -rf /tmp/raw-debs
        mkdir -p /tmp/raw-debs

        while IFS= read -r repo; do
          [ -z "$repo" ] && continue
          echo ">>> repo: $repo"
          mkdir -p "/tmp/raw-debs/$repo"
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            echo "    downloading: $tag"
            tmpdir=$(mktemp -d)
            if gh release download "$tag" --repo "$SRC" \
                 --pattern "*.deb" --dir "$tmpdir" 2>/dev/null
            then
              n=$(find "$tmpdir" -maxdepth 1 -type f -name '*.deb' | wc -l)
              echo "    got $n .deb"
              find "$tmpdir" -maxdepth 1 -type f -name '*.deb' -print0 \
                | xargs -0r mv -t "/tmp/raw-debs/$repo/"
            fi
            rm -rf "$tmpdir"
          done < <(grep -P "^${repo}\t" /tmp/plan/groups.txt | cut -f2)
        done < /tmp/plan/repos.txt

    # ==================================================================
    # 3. Build the four dists/ trees. Filename = flat basename.
    # ==================================================================
    - name: Build dists/ metadata
      run: |
        set -euo pipefail
        BUILD=/tmp/aptrepo
        rm -rf "$BUILD"
        mkdir -p "$BUILD"

        while IFS= read -r repo; do
          [ -z "$repo" ] && continue
          case "$repo" in
            main)  dist=stable; comp=main ;;
            x11)   dist=x11;    comp=main ;;
            root)  dist=root;   comp=stable ;;
            glibc) dist=glibc;  comp=main ;;
            *)     continue ;;
          esac

          echo ">>> building dists/${dist}/${comp} for $repo"

          outd="$BUILD/dists/${dist}/${comp}/binary-aarch64"
          mkdir -p "$outd"
          : > "$outd/Packages"

          # Dedup by package name, keep highest version
          tsv="/tmp/all-${repo}.tsv"
          : > "$tsv"
          shopt -s nullglob
          for deb in /tmp/raw-debs/"$repo"/*.deb; do
            dpkg-deb -I "$deb" >/dev/null 2>&1 || continue
            pkg=$(dpkg-deb -f "$deb" Package)
            ver=$(dpkg-deb -f "$deb" Version)
            printf '%s\t%s\t%s\n' "$pkg" "$ver" "$deb" >> "$tsv"
          done
          shopt -u nullglob

          sort -t$'\t' -k1,1 -k2,2rV "$tsv" | awk -F'\t' '!seen[$1]++' > "/tmp/winners-${repo}.tsv"

          placed=0
          while IFS=$'\t' read -r pkg ver path; do
            [ -z "$pkg" ] && continue
            fname=$(basename "$path")
            size=$(stat -c %s "$path")
            md5=$(md5sum "$path" | awk '{print $1}')
            sha1=$(sha1sum "$path" | awk '{print $1}')
            sha256=$(sha256sum "$path" | awk '{print $1}')

            # Emit control info
            dpkg-deb -f "$path" >> "$outd/Packages"
            {
              echo "Filename: ${fname}"     # flat! relative to HF root
              echo "Size: ${size}"
              echo "MD5sum: ${md5}"
              echo "SHA1: ${sha1}"
              echo "SHA256: ${sha256}"
              echo ""
            } >> "$outd/Packages"
            placed=$((placed + 1))
          done < "/tmp/winners-${repo}.tsv"

          echo "    entries: $placed"

          gzip -kf -9 "$outd/Packages"

          # Release file
          conf="/tmp/release-${repo}.conf"
          {
            echo 'APT::FTPArchive::Release::Origin "xodos";'
            echo "APT::FTPArchive::Release::Label \"xodos Termux ${repo}\";"
            echo "APT::FTPArchive::Release::Suite \"${dist}\";"
            echo "APT::FTPArchive::Release::Codename \"${dist}\";"
            echo 'APT::FTPArchive::Release::Architectures "aarch64";'
            echo "APT::FTPArchive::Release::Components \"${comp}\";"
            echo "APT::FTPArchive::Release::Description \"xodos Termux ${repo}\";"
          } > "$conf"

          cd "$BUILD"
          apt-ftparchive -c "$conf" release "dists/${dist}" > "dists/${dist}/Release"
          cp "dists/${dist}/Release" "dists/${dist}/InRelease"
          cd - >/dev/null
        done < /tmp/plan/repos.txt

        echo ""
        echo ">>> final structure:"
        find "$BUILD" -type f | sort | sed 's/^/    /'
        echo ""
        echo ">>> total size:"
        du -sh "$BUILD"

    # ==================================================================
    # 4. Upload ONLY the dists/ folder to HF.
    #    The .deb files are already there flat.
    # ==================================================================
    - name: Upload dists/ to Hugging Face
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
        HF_REPO: ${{ inputs.hf_repo_id }}
      run: |
        set -euo pipefail

        # Create repo if needed
        huggingface-cli repo create "$HF_REPO" --repo-type dataset --exist-ok --token "$HF_TOKEN"

        # Upload only dists/
        echo ">>> uploading dists/ ..."
        huggingface-cli upload "$HF_REPO" /tmp/aptrepo/dists dists \
          --repo-type dataset \
          --token "$HF_TOKEN" \
          --delete "*"     # wipe existing dists/ only, not .deb files

        echo ">>> upload complete"
        echo ">>> live at: https://huggingface.co/datasets/$HF_REPO/tree/main/dists"

    - name: Summary
      run: |
        {
          echo "## APT Metadata Published"
          echo ""
          echo "Base: \`https://huggingface.co/datasets/${{ inputs.hf_repo_id }}/resolve/main\`"
          echo ""
          echo "### sources.list"
          echo '```'
          echo "deb [trusted=yes] https://huggingface.co/datasets/${{ inputs.hf_repo_id }}/resolve/main stable main"
          echo "deb [trusted=yes] https://huggingface.co/datasets/${{ inputs.hf_repo_id }}/resolve/main x11 main"
          echo "deb [trusted=yes] https://huggingface.co/datasets/${{ inputs.hf_repo_id }}/resolve/main root stable"
          echo "deb [trusted=yes] https://huggingface.co/datasets/${{ inputs.hf_repo_id }}/resolve/main glibc main"
          echo '```'
        } >> $GITHUB_STEP_SUMMARY
