name: Sync Upstream

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync-upstream:
    # --- Use Ubuntu 22.04 for maximum stability ---
    runs-on: ubuntu-22.04

    steps:
      # ------------------------------------------------------------------
      # 0a. Sanity-check that the secret is actually visible to this job.
      # ------------------------------------------------------------------
      - name: Verify GH_PUSH_TOKEN is present
        env:
          TOKEN: ${{ secrets.GH_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          echo "token length = ${#TOKEN}"
          if [ -z "${TOKEN}" ]; then
            echo "::error::GH_PUSH_TOKEN is empty or not visible to this repository."
            exit 1
          fi

      # ------------------------------------------------------------------
      # 0b. Harden APT configuration to avoid mirror stalls.
      #     Disable same-mirror retries and set a short timeout so apt
      #     fails over to the next mirror quickly. (THRIFT-6234)
      # ------------------------------------------------------------------
      - name: Configure APT timeouts and retries
        run: |
          set -euo pipefail
          # Create a dedicated config fragment for our timeouts
          sudo tee /etc/apt/apt.conf.d/99-ci-timeouts > /dev/null <<'EOF'
          Acquire::Retries "0";
          Acquire::http::Timeout "20";
          Acquire::https::Timeout "20";
          DPkg::Lock::Timeout "120";
          EOF
          echo "APT timeout configuration applied."

      # ------------------------------------------------------------------
      # 0c. Robust apt-get update with a retry loop.
      #     Even with timeouts, a transient DNS blip can fail the first
      #     attempt. We retry up to 3 times with a short backoff.
      # ------------------------------------------------------------------
      - name: Update APT package lists (with retry)
        run: |
          set -euo pipefail
          MAX_ATTEMPTS=3
          for i in $(seq 1 $MAX_ATTEMPTS); do
            echo ">>> apt-get update attempt $i of $MAX_ATTEMPTS"
            if sudo apt-get update; then
              echo ">>> apt-get update succeeded on attempt $i"
              exit 0
            fi
            echo ">>> apt-get update attempt $i failed. Retrying in 5 seconds..."
            sleep 5
          done
          echo "::error::apt-get update failed after $MAX_ATTEMPTS attempts"
          exit 1

      # ------------------------------------------------------------------
      # 0d. Install/reinstall git.
      #     With the hardened APT config above, this should be reliable.
      # ------------------------------------------------------------------
      - name: Install git
        run: |
          set -euo pipefail
          sudo apt-get install -y --reinstall \
            git \
            git-man \
            ca-certificates
          git --version
          which git

      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.GH_PUSH_TOKEN }}

      - name: Configure git
        run: |
          set -euo pipefail
          git config --local user.email "github-actions@users.noreply.github.com"
          git config --local user.name  "github-actions"

      - name: Sync with upstream
        run: |
          set -euo pipefail

          git remote add upstream https://github.com/termux/termux-packages.git 2>/dev/null || \
            git remote set-url upstream https://github.com/termux/termux-packages.git

          git fetch upstream master
          git checkout master

          # ------------------------------------------------------------------
          # 1. Snapshot the paths we want to keep OUR version of.
          # ------------------------------------------------------------------
          KEEP_PATHS=(".github/workflows")
          mkdir -p /tmp/keep
          for p in "${KEEP_PATHS[@]}"; do
            dest="/tmp/keep/${p//\//__}"
            rm -rf "$dest"
            if [ -e "$p" ]; then
              cp -r "$p" "$dest"
            fi
          done

          # ------------------------------------------------------------------
          # 2. Reset every tracked file to upstream's version.
          # ------------------------------------------------------------------
          git checkout upstream/master -- .

          # ------------------------------------------------------------------
          # 3. Restore the paths we explicitly protected.
          # ------------------------------------------------------------------
          for p in "${KEEP_PATHS[@]}"; do
            src="/tmp/keep/${p//\//__}"
            if [ -e "$src" ]; then
              rm -rf "$p"
              mkdir -p "$(dirname "$p")"
              cp -r "$src" "$p"
            fi
          done

          # ------------------------------------------------------------------
          # 4. Show what actually changed.
          # ------------------------------------------------------------------
          echo ">>> changes staged for this sync:"
          git add -A
          git diff --cached --stat | tail -30 || true

          if git diff --cached --quiet; then
            echo ">>> No changes — already up to date with upstream."
          else
            git commit -m "chore: sync with upstream $(date -u +%Y%m%d-%H%M%S)"
            echo ">>> committed sync"
          fi

      - name: Push
        run: |
          set -euo pipefail

          git remote set-url origin \
            "https://x-access-token:${{ secrets.GH_PUSH_TOKEN }}@github.com/${{ github.repository }}"

          pushed=0
          for i in 1 2 3; do
            if git push --force origin "HEAD:refs/heads/master"; then
              echo "✔ pushed on attempt $i"
              pushed=1
              break
            fi
            echo "push attempt $i failed; retrying in 5s"
            sleep 5
          done

          if [ "${pushed}" -ne 1 ]; then
            echo "::error::push failed after 3 attempts"
            exit 1
          fi
          echo ">>> push succeeded"
