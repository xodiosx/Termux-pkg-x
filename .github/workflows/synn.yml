name: Sync Upstream

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync-upstream:
    # --- Use Ubuntu 26.04 (GA, future-proof for ubuntu-latest migration) ---
    runs-on: ubuntu-26.04

    steps:
      - name: Verify GH_PUSH_TOKEN is present
        env:
          TOKEN: ${{ secrets.GH_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          echo "token length = ${#TOKEN}"
          if [ -z "${TOKEN}" ]; then
            echo "::error::GH_PUSH_TOKEN is empty or not visible to this repository."
            exit 1
          fi

      # ------------------------------------------------------------------
      # 1. Bypass the Azure mirror in apt-mirrors.txt
      #    This is the critical step that fixes the DNS resolution issue.
      # ------------------------------------------------------------------
      - name: Replace Azure mirror with archive.ubuntu.com
        run: |
          set -euo pipefail
          MIRROR_LIST="/etc/apt/apt-mirrors.txt"
          if [ -f "$MIRROR_LIST" ] && grep -q "azure.archive.ubuntu.com" "$MIRROR_LIST"; then
            echo "Replacing azure.archive.ubuntu.com with archive.ubuntu.com"
            sudo sed -i 's#http://azure.archive.ubuntu.com/ubuntu#http://archive.ubuntu.com/ubuntu#g' "$MIRROR_LIST"
          else
            echo "Azure mirror not found in $MIRROR_LIST — no change needed."
          fi
          sudo sed -i 's#http://azure.archive.ubuntu.com/ubuntu#http://archive.ubuntu.com/ubuntu#g' /etc/apt/sources.list 2>/dev/null || true

      # ------------------------------------------------------------------
      # 2. Hardening APT: fast fail-over to the next mirror
      # ------------------------------------------------------------------
      - name: Configure APT timeouts and disable same-mirror retries
        run: |
          set -euo pipefail
          sudo tee /etc/apt/apt.conf.d/99-ci-timeouts > /dev/null <<'EOF'
          Acquire::Retries "0";
          Acquire::http::Timeout "20";
          Acquire::https::Timeout "20";
          DPkg::Lock::Timeout "120";
          EOF
          echo "APT timeout configuration applied."

      # ------------------------------------------------------------------
      # 3. Robust apt-get update + install with a retry loop
      # ------------------------------------------------------------------
      - name: Update APT and install git (with retries)
        run: |
          set -euo pipefail
          MAX_ATTEMPTS=3
          for i in $(seq 1 $MAX_ATTEMPTS); do
            echo ">>> Attempt $i of $MAX_ATTEMPTS: apt-get update"
            if sudo apt-get update; then
              echo ">>> apt-get update succeeded."
              break
            fi
            if [ "$i" -eq "$MAX_ATTEMPTS" ]; then
              echo "::error::apt-get update failed after $MAX_ATTEMPTS attempts."
              exit 1
            fi
            echo ">>> apt-get update failed. Retrying in 5 seconds..."
            sleep 5
          done

          for i in $(seq 1 $MAX_ATTEMPTS); do
            echo ">>> Attempt $i of $MAX_ATTEMPTS: apt-get install git ca-certificates"
            if sudo apt-get install -y --reinstall git git-man ca-certificates; then
              echo ">>> git installation succeeded."
              git --version
              which git
              break
            fi
            if [ "$i" -eq "$MAX_ATTEMPTS" ]; then
              echo "::error::apt-get install failed after $MAX_ATTEMPTS attempts."
              exit 1
            fi
            echo ">>> apt-get install failed. Retrying in 5 seconds..."
            sleep 5
          done

      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.GH_PUSH_TOKEN }}

      - name: Configure git
        run: |
          set -euo pipefail
          git config --local user.email "github-actions@users.noreply.github.com"
          git config --local user.name  "github-actions"

      - name: Sync with upstream
        run: |
          set -euo pipefail

          git remote add upstream https://github.com/termux/termux-packages.git 2>/dev/null || \
            git remote set-url upstream https://github.com/termux/termux-packages.git

          git fetch upstream master
          git checkout master

          KEEP_PATHS=(".github/workflows")
          mkdir -p /tmp/keep
          for p in "${KEEP_PATHS[@]}"; do
            dest="/tmp/keep/${p//\//__}"
            rm -rf "$dest"
            if [ -e "$p" ]; then
              cp -r "$p" "$dest"
            fi
          done

          git checkout upstream/master -- .

          for p in "${KEEP_PATHS[@]}"; do
            src="/tmp/keep/${p//\//__}"
            if [ -e "$src" ]; then
              rm -rf "$p"
              mkdir -p "$(dirname "$p")"
              cp -r "$src" "$p"
            fi
          done

          echo ">>> changes staged for this sync:"
          git add -A
          git diff --cached --stat | tail -30 || true

          if git diff --cached --quiet; then
            echo ">>> No changes — already up to date with upstream."
          else
            git commit -m "chore: sync with upstream $(date -u +%Y%m%d-%H%M%S)"
            echo ">>> committed sync"
          fi

      - name: Push
        run: |
          set -euo pipefail

          git remote set-url origin \
            "https://x-access-token:${{ secrets.GH_PUSH_TOKEN }}@github.com/${{ github.repository }}"

          pushed=0
          for i in 1 2 3; do
            if git push --force origin "HEAD:refs/heads/master"; then
              echo "✔ pushed on attempt $i"
              pushed=1
              break
            fi
            echo "push attempt $i failed; retrying in 5s"
            sleep 5
          done

          if [ "${pushed}" -ne 1 ]; then
            echo "::error::push failed after 3 attempts"
            exit 1
          fi
          echo ">>> push succeeded"
