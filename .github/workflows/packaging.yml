name: Build & Release Packages

on:
  push:
    branches: [master]
    paths:
      - 'packages/**'
      - 'x11-packages/**'
  workflow_dispatch:
    inputs:
      packages:
        description: "Space-separated package names to build"
        required: false
      free-space:
        type: boolean
        default: false
      use-repo-deps:
        description: "Fetch dependencies from our HF repo instead of building them from source"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-release:
    permissions:
      contents: write
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
    - uses: actions/checkout@v6
      with: { fetch-depth: 1 }

    - name: Compute release tag
      id: tag
      run: |
        TAG="$(date -u +'%Y.%m.%d-%H%M%S')"
        echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

    - name: Create release
      run: |
        set -euo pipefail
        TAG="${{ steps.tag.outputs.tag }}"
        gh release create "$TAG" \
          --title "Build $TAG" \
          --notes "Automated package build." \
          --target "${{ github.sha }}" \
          || { echo "::error::Failed to create release '$TAG'"; exit 1; }

  build:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        target_arch: [aarch64]
      fail-fast: false
    steps:
    - name: Clone repository
      uses: actions/checkout@v6
      with: { fetch-depth: 1000 }

    - name: Ensure work directories exist
      run: mkdir -p ./artifacts ./debs ./output

    - name: Drop duplicate root-packages
      run: |
        set -euo pipefail
        if [ -d root-packages ]; then
          for d in root-packages/*/; do
            [ -d "$d" ] || continue
            p=$(basename "$d")
            if [ -d "packages/$p" ]; then
              rm -rf "root-packages/$p"
            fi
          done
        fi
        if jq -e 'has("root-packages")' repo.json >/dev/null 2>&1; then
          jq 'del(.["root-packages"])' repo.json > repo.json.tmp
          mv repo.json.tmp repo.json
        fi
        jq -r 'keys[]' repo.json

    - name: Rename com.termux -> app.xodos2 globally
      run: |
        set -euo pipefail
        find . \
          -path ./.git -prune -false -o \
          -path ./.github -prune -false -o \
          -path ./debs -prune -false -o \
          -path ./artifacts -prune -false -o \
          -path ./output -prune -false -o \
          -type f -print0 | \
        xargs -0 -r -n50 sed -i 's/com\.termux/app.xodos2/g'
        grep -nE '^TERMUX_APP__PACKAGE_NAME=' scripts/properties.sh || true

    # ==================================================================
    # Patch termux-tools:
    #   - ship a single default mirror file pointing to HF main
    #   - drop termux-change-repo (nothing to change)
    #   - replace pkg with a thin wrapper over apt (no mirror logic)
    # Tab-indented, because termux lint-packages.sh requires tabs.
    # ==================================================================
    - name: Patch termux-tools for custom repo (tab-indented)
      run: |
        set -euo pipefail
        TOOLS_BUILD="packages/termux-tools/build.sh"
        [ -f "$TOOLS_BUILD" ] || { echo "::error::$TOOLS_BUILD not found"; exit 1; }

        RAW=/tmp/tools-raw.txt
        cat > "$RAW" <<'RAWEOF'
        termux_step_post_make_install() {
          TERMUX_PKG_CONFFILES="$(cat "$TERMUX_PKG_BUILDDIR/conffiles")"

          MIRROR_DIR="$TERMUX_PREFIX/etc/termux/mirrors"
          rm -rf "$MIRROR_DIR"
          mkdir -p "$MIRROR_DIR"
          cat > "$MIRROR_DIR/default" <<'MIRROREOF'
        # This file is sourced by pkg
        WEIGHT=10
        MAIN="https://huggingface.co/datasets/xodiosx/xodos-packages/resolve/main/xodos-main"
        MIRROREOF

          rm -f "$TERMUX_PREFIX/bin/termux-change-repo"

          cat > "$TERMUX_PREFIX/bin/pkg" <<'PKGEOF'
        #!/data/data/app.xodos2/files/usr/bin/bash
        TERMUX_PREFIX=/data/data/app.xodos2/files/usr
        export PATH="$TERMUX_PREFIX/bin:$PATH"
        export TERMUX_PREFIX
        CMD="$1"
        shift 2>/dev/null || true
        case "$CMD" in
          up|update) exec apt update "$@" ;;
          upgrade) exec apt upgrade "$@" ;;
          full-upgrade) exec apt full-upgrade "$@" ;;
          install) exec apt install "$@" ;;
          reinstall) exec apt install --reinstall "$@" ;;
          downgrade) exec apt install --allow-downgrades "$@" ;;
          uninstall|remove) exec apt remove "$@" ;;
          purge) exec apt purge "$@" ;;
          autoremove) exec apt autoremove "$@" ;;
          autoclean) exec apt autoclean "$@" ;;
          clean) exec apt clean "$@" ;;
          list) exec apt list "$@" ;;
          list-all) exec apt list --all-versions "$@" ;;
          list-installed) exec apt list --installed "$@" ;;
          list-upgradable) exec apt list --upgradable "$@" ;;
          search) exec apt search "$@" ;;
          show) exec apt show "$@" ;;
          files) exec dpkg -L "$@" ;;
          hold|unhold) exec apt-mark "$CMD" "$@" ;;
          ""|help|-h|--help)
            echo "Usage: pkg <command> [args]"
            ;;
          *) echo "pkg: unknown command '$CMD'" >&2; exit 1 ;;
        esac
        PKGEOF
          chmod +x "$TERMUX_PREFIX/bin/pkg"
        }
        RAWEOF

        awk '
          {
            if (match($0, /^ +/)) {
              n = RLENGTH
              rest = substr($0, n + 1)
              tabs = ""
              for (i = 0; i < int(n / 2); i++) tabs = tabs "\t"
              print tabs rest
            } else {
              print
            }
          }
        ' "$RAW" > "$RAW.tab"
        mv "$RAW.tab" "$RAW"

        echo "" >> "$TOOLS_BUILD"
        cat "$RAW" >> "$TOOLS_BUILD"
        echo ">>> patched termux-tools (last 30 lines):"
        tail -30 "$TOOLS_BUILD" | cat -A | head -30

    # ==================================================================
    # Patch apt:
    #   - remove termux-keyring from DEPENDS
    #   - append a new termux_step_post_make_install that writes the
    #     multi-repo sources.list (4 HF repos + commented TUR)
    # The appended function overrides the original because bash uses
    # the last definition of a function in a sourced file.
    # ==================================================================
    - name: Patch apt package (custom repo + no keyring)
      run: |
        set -euo pipefail
        APT_BUILD="packages/apt/build.sh"
        [ -f "$APT_BUILD" ] || { echo "::error::$APT_BUILD not found"; exit 1; }

        # 1. Remove termux-keyring from DEPENDS (no signing keyring)
        sed -i 's/, termux-keyring//g' "$APT_BUILD"
        sed -i 's/termux-keyring, //g' "$APT_BUILD"
        sed -i 's/ termux-keyring//g'  "$APT_BUILD"
        sed -i 's/termux-keyring//g'   "$APT_BUILD"

        # 2. Append a new termux_step_post_make_install that writes
        #    our multi-repo sources.list. Last definition wins in bash.
        RAW=/tmp/apt-raw.txt
        cat > "$RAW" <<'RAWEOF'
        termux_step_post_make_install() {
          cat > "$TERMUX_PREFIX/etc/apt/sources.list" <<'SLEOF'
        deb [trusted=yes] https://huggingface.co/datasets/xodiosx/xodos-packages/resolve/main/xodos-main stable main
        deb [trusted=yes] https://huggingface.co/datasets/xodiosx/xodos-packages/resolve/main/xodos-x11 x11 main
        deb [trusted=yes] https://huggingface.co/datasets/xodiosx/xodos-packages/resolve/main/xodos-root root stable
        deb [trusted=yes] https://huggingface.co/datasets/xodiosx/xodos-packages/resolve/main/xodos-glibc glibc main
        # Uncomment to enable TUR (Termux User Repository):
        # deb [trusted=yes] https://tur.kcubeterm.com tur-packages tur
        SLEOF

          ln -sfr "$TERMUX_PREFIX/lib/apt/methods/http" "$TERMUX_PREFIX/lib/apt/methods/tor"
          ln -sfr "$TERMUX_PREFIX/lib/apt/methods/http" "$TERMUX_PREFIX/lib/apt/methods/tor+http"
          ln -sfr "$TERMUX_PREFIX/lib/apt/methods/https" "$TERMUX_PREFIX/lib/apt/methods/tor+https"
          local dir="$TERMUX_PREFIX/share/apt-transport-tor"
          mkdir -p "$dir"
          touch "$dir/.placeholder"
        }
        RAWEOF

        awk '
          {
            if (match($0, /^ +/)) {
              n = RLENGTH
              rest = substr($0, n + 1)
              tabs = ""
              for (i = 0; i < int(n / 2); i++) tabs = tabs "\t"
              print tabs rest
            } else {
              print
            }
          }
        ' "$RAW" > "$RAW.tab"
        mv "$RAW.tab" "$RAW"

        echo "" >> "$APT_BUILD"
        cat "$RAW" >> "$APT_BUILD"
        echo ">>> patched apt (last 30 lines):"
        tail -30 "$APT_BUILD" | cat -A | head -30

    # ==================================================================
    # Override repository URL (setup variables):
    #   - 4 HF repos in parallel arrays: URL / DISTRIBUTION / COMPONENT
    #   - TUR entry is added as a comment for future enablement
    # ==================================================================
    - name: Override repository URL (setup variables)
      run: |
        set -euo pipefail
        SETUP="scripts/build/termux_step_setup_variables.sh"
        if [ -f "$SETUP" ]; then
          awk '
            /^TERMUX_REPO_URL=\(/           { in_url=1; next }
            in_url && /^\)/                 { in_url=0; next }
            in_url                          { next }
            /^TERMUX_REPO_DISTRIBUTION=\(/  { in_dist=1; next }
            in_dist && /^\)/                { in_dist=0; next }
            in_dist                         { next }
            /^TERMUX_REPO_COMPONENT=\(/     { in_comp=1; next }
            in_comp && /^\)/                { in_comp=0; next }
            in_comp                         { next }
            /^TERMUX_BUILD_TUPLE=/ {
              print "TERMUX_REPO_URL=("
              print "https://huggingface.co/datasets/xodiosx/xodos-packages/resolve/main/xodos-main"
              print "https://huggingface.co/datasets/xodiosx/xodos-packages/resolve/main/xodos-x11"
              print "https://huggingface.co/datasets/xodiosx/xodos-packages/resolve/main/xodos-root"
              print "https://huggingface.co/datasets/xodiosx/xodos-packages/resolve/main/xodos-glibc"
              print "# Uncomment to enable TUR:"
              print "# https://tur.kcubeterm.com"
              print ")"
              print "TERMUX_REPO_DISTRIBUTION=("
              print "stable"
              print "x11"
              print "root"
              print "glibc"
              print "# tur-packages"
              print ")"
              print "TERMUX_REPO_COMPONENT=("
              print "main"
              print "main"
              print "stable"
              print "main"
              print "# tur"
              print ")"
            }
            { print }
          ' "$SETUP" > "$SETUP.new" && mv "$SETUP.new" "$SETUP"
          echo ">>> patched setup variables:"
          grep -nE '^TERMUX_REPO_(URL|DISTRIBUTION|COMPONENT)=' "$SETUP" || true
          echo ">>> first 30 lines around the arrays:"
          awk '/^TERMUX_REPO_URL=\(/,/^TERMUX_BUILD_TUPLE=/' "$SETUP" | head -30
        fi

    # ==================================================================
    # Configure dependency strategy
    # ==================================================================
    - name: Configure dependency strategy
      env:
        USE_REPO_DEPS: ${{ github.event.inputs.use-repo-deps || 'false' }}
      run: |
        set -euo pipefail
        echo ">>> use-repo-deps=${USE_REPO_DEPS}"

        TDP="scripts/build/termux_download_deb_pac.sh"
        [ -f "$TDP" ] || { echo "::error::$TDP not found"; exit 1; }

        if [ "$USE_REPO_DEPS" = "true" ]; then
          echo ">>> Dependencies fetched from Hugging Face repos"
          sed -i 's|Packages\.xz|Packages.gz|g' "$TDP"
          sed -i 's|xz -d|gzip -d|g'             "$TDP"
          sed -i 's|unxz|gunzip|g'               "$TDP"
          grep -nE 'Packages\.gz|gzip -d|gunzip' "$TDP" || true
        else
          echo ">>> Forcing source builds of all dependencies"
          if ! grep -q 'FORCED-BY-CI-FORCE-SOURCE-BUILD' "$TDP"; then
            sed -i '/^termux_download_deb_pac() {/a\    # FORCED-BY-CI-FORCE-SOURCE-BUILD: return failure' "$TDP"
            sed -i '/FORCED-BY-CI-FORCE-SOURCE-BUILD: return failure/a\    return 1' "$TDP"
          fi
        fi

    - name: Gather build summary
      id: build-info
      env:
        MANUAL_INPUT_PACKAGES: ${{ github.event.inputs.packages }}
      run: |
        set -euo pipefail
        mkdir -p ./artifacts ./debs ./output
        touch ./debs/.placeholder

        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          read -a PACKAGES <<< "${MANUAL_INPUT_PACKAGES//$'\n'/ }"
          repo_paths=$(jq --raw-output 'del(.pkg_format) | keys | .[]' repo.json)
          declare -a resolved=()
          for pkg in "${PACKAGES[@]}"; do
            if [ -z "$pkg" ]; then continue; fi
            case "$pkg" in
              vkmark)
                echo "::warning::Skipping '$pkg'"
                continue
                ;;
            esac
            for repo_path in $repo_paths; do
              repo=$(jq --raw-output '.["'${repo_path}'"].name' repo.json)
              if [ -d "${repo_path}/${pkg}" ]; then
                echo "$pkg" >> "./built_${repo}_packages.txt"
                for subpkg in $(find "${repo_path}/${pkg}/" -maxdepth 1 -type f -name '*.subpackage.sh' | sort); do
                  echo "$(basename "${subpkg%%.subpackage.sh}")" >> "./built_${repo}_subpackages.txt"
                done
                resolved+=("$pkg")
                break
              fi
            done
          done
          echo ">>> resolved ${#resolved[@]}: ${resolved[*]:-<none>}"
          if [ "${#resolved[@]}" -eq 0 ]; then
            echo "::error::None found."
            exit 1
          fi
        fi

    - name: Lint packages
      run: |
        set -euo pipefail
        declare -a package_recipes=()
        for repo_path in $(jq --raw-output 'del(.pkg_format) | keys | .[]' repo.json); do
          repo=$(jq --raw-output '.["'${repo_path}'"].name' repo.json)
          if [ -f "./built_${repo}_packages.txt" ]; then
            while read -r p; do
              if [ -n "$p" ]; then package_recipes+=("${repo_path}/${p}/build.sh"); fi
            done < "./built_${repo}_packages.txt"
          fi
        done
        if [ "${#package_recipes[@]}" -gt 0 ]; then
          ./scripts/lint-packages.sh "${package_recipes[@]}"
        fi

    - name: Enable zram
      uses: ./.github/actions/zram
      with:
        algorithm: zstd
        size: 16G
        priority: 100
        device_name: /dev/zram0

    - name: Load Docker image
      run: ./scripts/run-docker.sh true

    - name: Free additional disk space
      if: ${{ steps.build-info.outputs.free-space == 'true' }}
      run: ./scripts/free-space.sh

    - name: Build packages
      run: |
        set -euo pipefail
        declare -a packages=()
        for repo_path in $(jq --raw-output 'del(.pkg_format) | keys | .[]' repo.json); do
          repo=$(jq --raw-output '.["'${repo_path}'"].name' repo.json)
          if [ -f "./built_${repo}_packages.txt" ]; then
            while read -r p; do
              if [ -n "$p" ]; then packages+=("$p"); fi
            done < "./built_${repo}_packages.txt"
          fi
        done

        if [ "${#packages[@]}" -eq 0 ]; then
          echo ">>> no packages — nothing to do"
          exit 0
        fi

        echo ">>> requested (${#packages[@]}): ${packages[*]}"

        TARGET_PATHS=""
        for p in "${packages[@]}"; do
          if   [ -d "packages/$p" ];      then TARGET_PATHS="$TARGET_PATHS packages/$p"
          elif [ -d "x11-packages/$p" ];  then TARGET_PATHS="$TARGET_PATHS x11-packages/$p"
          else
            echo "::warning::Package '$p' not found in packages/ or x11-packages/"
          fi
        done
        echo ">>> paths: $TARGET_PATHS"

        : > /tmp/buildorder-full.txt
        if [ -f scripts/buildorder.py ] && [ -n "$TARGET_PATHS" ]; then
          echo ">>> Running buildorder.py..."
          python3 scripts/buildorder.py $TARGET_PATHS 2>/tmp/buildorder-err.txt \
            | awk 'NF >= 1 { print $1 }' \
            > /tmp/buildorder-full.txt || {
            echo "::warning::buildorder.py failed. stderr:"
            head -10 /tmp/buildorder-err.txt || true
            : > /tmp/buildorder-full.txt
          }
          echo ">>> buildorder.py produced $(wc -l < /tmp/buildorder-full.txt) entries"
        fi

        : > /tmp/ordered.txt
        if [ -s /tmp/buildorder-full.txt ]; then
          while read -r ordered_pkg; do
            [ -z "$ordered_pkg" ] && continue
            for want in "${packages[@]}"; do
              if [ "$ordered_pkg" = "$want" ]; then
                echo "$ordered_pkg" >> /tmp/ordered.txt
                break
              fi
            done
          done < /tmp/buildorder-full.txt
        fi

        for p in "${packages[@]}"; do
          grep -qx "$p" /tmp/ordered.txt || echo "$p" >> /tmp/ordered.txt
        done

        awk '!seen[$1]++' /tmp/ordered.txt > /tmp/ordered.dedup && mv /tmp/ordered.dedup /tmp/ordered.txt

        PKGS_STR="$(tr '\n' ' ' < /tmp/ordered.txt | sed 's/ *$//')"
        echo ">>> ordered build list (${#packages[@]}): $PKGS_STR"

        {
          echo 'set -uo pipefail'
          echo 'PREFIX=/data/data/app.xodos2/files/usr'
          echo 'BUILD_ROOT=/home/builder/termux-packages'
          echo 'mkdir -p "$PREFIX/var/lib/dpkg/info"'
          echo 'cd "$BUILD_ROOT"'
          echo ''
          echo 'rm -rf /data/data/.built-packages 2>/dev/null || true'
          echo 'rm -rf /data/data/app.xodos2/.built-packages 2>/dev/null || true'
          echo 'rm -rf /data/data/app.xodos2/files/.built-packages 2>/dev/null || true'
          echo ''
          echo 'declare -a failed=()'
          echo 'declare -a built=()'
          echo "for pkg in ${PKGS_STR}; do"
          echo '  echo "=================================================="'
          echo '  echo ">>> Building: $pkg"'
          echo '  echo "=================================================="'
          echo '  if ./build-package.sh -C -f -a aarch64 "$pkg"; then'
          echo '    built+=("$pkg")'
          echo '    echo ">>> OK: $pkg"'
          echo '  else'
          echo '    failed+=("$pkg")'
          echo '    echo ">>> FAILED: $pkg"'
          echo '  fi'
          echo 'done'
          echo 'echo ""'
          echo 'echo "=================================================="'
          echo "echo \">>> built \${#built[@]}: \${built[*]:-<none>}\""
          echo "echo \">>> failed \${#failed[@]}: \${failed[*]:-<none>}\""
          echo 'echo "=================================================="'
          echo 'if [ "${#failed[@]}" -gt 0 ]; then exit 2; fi'
        } > /tmp/inner-build.sh

        cat /tmp/inner-build.sh
        ENCODED=$(base64 -w0 /tmp/inner-build.sh)
        ./scripts/run-docker.sh -d bash -c "echo '${ENCODED}' | base64 -d | bash" || true

    - name: Generate build artifacts
      if: always()
      run: |
        set -uo pipefail
        mkdir -p debs artifacts output

        if [ -d termux-packages/output ]; then
          find termux-packages/output -maxdepth 1 -type f -print0 2>/dev/null \
            | xargs -0r mv -t ./output/ 2>/dev/null || true
        fi

        find output -maxdepth 1 -type f -name '*.deb' -print0 2>/dev/null \
          | xargs -0r mv -t debs/ 2>/dev/null || true

        for repo in $(jq --raw-output 'del(.pkg_format) | .[].name' repo.json); do
          if [ -f "./built_${repo}_packages.txt" ]; then
            mv "./built_${repo}_packages.txt" ./debs/ || true
          fi
          if [ -f "./built_${repo}_subpackages.txt" ]; then
            cat "./built_${repo}_subpackages.txt" >> "./debs/built_${repo}_packages.txt" 2>/dev/null || true
            rm -f "./built_${repo}_subpackages.txt"
          fi
        done

        n=$(find debs -type f -name '*.deb' 2>/dev/null | wc -l)
        echo ">>> debs/ contains: ${n} .deb files"
        tar cf "artifacts/debs-${{ matrix.target_arch }}-${{ github.sha }}.tar" debs

    - name: Store *.deb files
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: debs-${{ matrix.target_arch }}-${{ github.sha }}
        path: ./artifacts

  release:
    permissions:
      contents: write
    needs: [build, prepare-release]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - uses: actions/checkout@v6
      with: { fetch-depth: 1 }
    - uses: actions/download-artifact@v6
      with: { path: ./all-artifacts }

    - name: Extract .deb files from tarballs
      run: |
        set -euo pipefail
        mkdir -p release-debs

        mapfile -t ARCHIVES < <(find all-artifacts -type f -name 'debs-*.tar' 2>/dev/null || true)
        echo ">>> found ${#ARCHIVES[@]} tar archive(s)"
        if [ "${#ARCHIVES[@]}" -eq 0 ]; then
          echo "::error::No debs-*.tar files under all-artifacts/"
          exit 1
        fi

        for archive in "${ARCHIVES[@]}"; do
          tar xf "$archive" -C release-debs
        done

        count=$(find release-debs -type f -name '*.deb' | wc -l)
        echo ">>> found ${count} .deb files"
        if [ "$count" -eq 0 ]; then
          echo "::error::No .deb files found inside the extracted tars"
          exit 1
        fi

    - name: Upload .deb files
      run: |
        set -euo pipefail
        TAG="${{ needs.prepare-release.outputs.tag }}"
        mapfile -t FILES < <(find release-debs -type f -name '*.deb' | sort)
        total="${#FILES[@]}"
        i=0
        failed=0
        for f in "${FILES[@]}"; do
          i=$((i + 1))
          printf '[%d/%d] %s ... ' "$i" "$total" "$(basename "$f")"
          ok=0
          for attempt in 1 2 3 4 5; do
            if gh release upload "$TAG" "$f" --clobber 2>/tmp/gh_err.log; then ok=1; break; fi
            if grep -qiE 'secondary rate limit|abuse|rate limit' /tmp/gh_err.log; then
              backoff=$((attempt * 15))
            else
              backoff=$((attempt * 3))
            fi
            sleep "$backoff"
          done
          if [ "$ok" -eq 1 ]; then echo ok; else echo "FAILED: $(basename "$f")"; failed=$((failed + 1)); fi
          sleep 1
        done
        if [ "$failed" -gt 0 ]; then
          echo "::error::${failed}/${total} failed"
          exit 1
        fi
        echo ">>> all ${total} uploaded"

    - name: Verify release assets
      run: |
        TAG="${{ needs.prepare-release.outputs.tag }}"
        count=$(gh release view "$TAG" --json assets --jq '.assets | length')
        echo ">>> release ${TAG} has ${count} assets"
