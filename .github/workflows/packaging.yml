name: Build & Release Packages

on:
  push:
    branches: [master]
    paths:
      - 'packages/**'
      - 'x11-packages/**'
  workflow_dispatch:
    inputs:
      packages:
        description: "Space-separated package names to build"
        required: false
      free-space:
        type: boolean
        default: false
      use-repo-deps:
        description: "Fetch dependencies from our repo instead of building them from source"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-release:
    permissions:
      contents: write
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
    - uses: actions/checkout@v6
      with: { fetch-depth: 1 }

    - name: Compute release tag
      id: tag
      run: |
        TAG="$(date -u +'%Y.%m.%d-%H%M%S')"
        echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

    - name: Create release
      run: |
        set -euo pipefail
        TAG="${{ steps.tag.outputs.tag }}"
        gh release create "$TAG" \
          --title "Build $TAG" \
          --notes "Automated package build." \
          --target "${{ github.sha }}" \
          || { echo "::error::Failed to create release '$TAG'"; exit 1; }

  build:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        target_arch: [aarch64]
      fail-fast: false
    steps:
    - name: Clone repository
      uses: actions/checkout@v6
      with: { fetch-depth: 1000 }

    - name: Ensure work directories exist
      run: mkdir -p ./artifacts ./debs ./output

    - name: Drop duplicate root-packages
      run: |
        set -euo pipefail
        if [ -d root-packages ]; then
          for d in root-packages/*/; do
            [ -d "$d" ] || continue
            p=$(basename "$d")
            if [ -d "packages/$p" ]; then
              echo ">>> removing root-packages/$p (also in packages/)"
              rm -rf "root-packages/$p"
            fi
          done
        fi
        if jq -e 'has("root-packages")' repo.json >/dev/null 2>&1; then
          jq 'del(.["root-packages"])' repo.json > repo.json.tmp
          mv repo.json.tmp repo.json
        fi
        jq -r 'keys[]' repo.json

    - name: Rename com.termux -> app.xodos2 globally
      run: |
        set -euo pipefail
        find . \
          -path ./.git -prune -false -o \
          -path ./.github -prune -false -o \
          -path ./debs -prune -false -o \
          -path ./artifacts -prune -false -o \
          -path ./output -prune -false -o \
          -type f -print0 | \
        xargs -0 -r -n50 sed -i 's/com\.termux/app.xodos2/g'
        grep -nE '^TERMUX_APP__PACKAGE_NAME=' scripts/properties.sh || true

    # =================================================================
    # Patch termux-tools:
    #   - Wipe mirrors/ entirely, put ONE file (default) with our URL.
    #   - Remove termux-change-repo (nothing to change).
    #   - Replace pkg with a wrapper that ignores the mirror system.
    # All shell uses tabs (Termux lint requires it), so we write the
    # patch with 2-space indentation and convert to tabs via awk.
    # =================================================================
    - name: Patch termux-tools for custom repo (tab-indented)
      run: |
        set -euo pipefail
        TOOLS_BUILD="packages/termux-tools/build.sh"
        [ -f "$TOOLS_BUILD" ] || { echo "::error::$TOOLS_BUILD not found"; exit 1; }

        RAW=/tmp/tools-raw.txt
        cat > "$RAW" <<'RAWEOF'
        termux_step_post_make_install() {
          TERMUX_PKG_CONFFILES="$(cat "$TERMUX_PKG_BUILDDIR/conffiles")"

          MIRROR_DIR="$TERMUX_PREFIX/etc/termux/mirrors"
          rm -rf "$MIRROR_DIR"
          mkdir -p "$MIRROR_DIR"
          cat > "$MIRROR_DIR/default" <<'MIRROREOF'
        # This file is sourced by pkg
        WEIGHT=10
        MAIN="https://xodiosx.github.io/Termux-pkg-x"
        MIRROREOF

          rm -f "$TERMUX_PREFIX/bin/termux-change-repo"

          cat > "$TERMUX_PREFIX/bin/pkg" <<'PKGEOF'
        #!/data/data/app.xodos2/files/usr/bin/bash
        TERMUX_PREFIX=/data/data/app.xodos2/files/usr
        export PATH="$TERMUX_PREFIX/bin:$PATH"
        export TERMUX_PREFIX
        CMD="$1"
        shift 2>/dev/null || true
        case "$CMD" in
          up|update) exec apt update "$@" ;;
          upgrade) exec apt upgrade "$@" ;;
          full-upgrade) exec apt full-upgrade "$@" ;;
          install) exec apt install "$@" ;;
          reinstall) exec apt install --reinstall "$@" ;;
          downgrade) exec apt install --allow-downgrades "$@" ;;
          uninstall|remove) exec apt remove "$@" ;;
          purge) exec apt purge "$@" ;;
          autoremove) exec apt autoremove "$@" ;;
          autoclean) exec apt autoclean "$@" ;;
          clean) exec apt clean "$@" ;;
          list) exec apt list "$@" ;;
          list-all) exec apt list --all-versions "$@" ;;
          list-installed) exec apt list --installed "$@" ;;
          list-upgradable) exec apt list --upgradable "$@" ;;
          search) exec apt search "$@" ;;
          show) exec apt show "$@" ;;
          files) exec dpkg -L "$@" ;;
          hold|unhold) exec apt-mark "$CMD" "$@" ;;
          ""|help|-h|--help)
            echo "Usage: pkg <command> [args]"
            echo "Commands: up upgrade full-upgrade install reinstall remove"
            echo "          purge autoremove clean list list-all list-installed"
            echo "          list-upgradable search show files hold unhold"
            ;;
          *) echo "pkg: unknown command '$CMD'" >&2; exit 1 ;;
        esac
        PKGEOF
          chmod +x "$TERMUX_PREFIX/bin/pkg"
        }
        RAWEOF

        awk '
          {
            if (match($0, /^ +/)) {
              n = RLENGTH
              rest = substr($0, n + 1)
              tabs = ""
              for (i = 0; i < int(n / 2); i++) tabs = tabs "\t"
              print tabs rest
            } else {
              print
            }
          }
        ' "$RAW" > "$RAW.tab"
        mv "$RAW.tab" "$RAW"

        echo "" >> "$TOOLS_BUILD"
        cat "$RAW" >> "$TOOLS_BUILD"

        echo ">>> patch (^I = tab):"
        cat -A "$RAW"

    - name: Patch apt package (custom repo + no keyring)
      run: |
        set -euo pipefail
        APT_BUILD="packages/apt/build.sh"
        [ -f "$APT_BUILD" ] || { echo "::error::$APT_BUILD not found"; exit 1; }
        sed -i 's/, termux-keyring//g' "$APT_BUILD"
        sed -i 's/termux-keyring, //g' "$APT_BUILD"
        sed -i 's/ termux-keyring//g'  "$APT_BUILD"
        sed -i 's/termux-keyring//g'   "$APT_BUILD"
        sed -i 's|deb https://packages-cf\.termux\.dev/apt/termux-main/ stable main|deb [trusted=yes] https://xodiosx.github.io/Termux-pkg-x stable main|g' "$APT_BUILD"
        sed -i 's|deb https://packages-cf\.termux\.dev/apt/termux-main stable main|deb [trusted=yes] https://xodiosx.github.io/Termux-pkg-x stable main|g'  "$APT_BUILD"

    - name: Override repository URL (~/.termuxrc + setup variables)
      run: |
        set -euo pipefail
        {
          echo 'TERMUX_REPO_PACKAGE="app.xodos2"'
          echo 'TERMUX_REPO_URL=('
          echo '  https://xodiosx.github.io/Termux-pkg-x'
          echo ')'
          echo 'TERMUX_REPO_DISTRIBUTION=('
          echo '  stable'
          echo ')'
          echo 'TERMUX_REPO_COMPONENT=('
          echo '  main'
          echo ')'
        } > "$HOME/.termuxrc"

        SETUP="scripts/build/termux_step_setup_variables.sh"
        if [ -f "$SETUP" ]; then
          awk '
            /^TERMUX_REPO_URL=\(/           { in_url=1; next }
            in_url && /^\)/                 { in_url=0; next }
            in_url                          { next }
            /^TERMUX_REPO_DISTRIBUTION=\(/  { in_dist=1; next }
            in_dist && /^\)/                { in_dist=0; next }
            in_dist                         { next }
            /^TERMUX_REPO_COMPONENT=\(/     { in_comp=1; next }
            in_comp && /^\)/                { in_comp=0; next }
            in_comp                         { next }
            /^TERMUX_BUILD_TUPLE=/ {
              print "TERMUX_REPO_URL=(https://xodiosx.github.io/Termux-pkg-x)"
              print "TERMUX_REPO_DISTRIBUTION=(stable)"
              print "TERMUX_REPO_COMPONENT=(main)"
            }
            { print }
          ' "$SETUP" > "$SETUP.new" && mv "$SETUP.new" "$SETUP"
        fi

    - name: Configure dependency strategy
      env:
        USE_REPO_DEPS: ${{ github.event.inputs.use-repo-deps || 'false' }}
      run: |
        set -euo pipefail
        echo ">>> use-repo-deps=${USE_REPO_DEPS}"

        TDP="scripts/build/termux_download_deb_pac.sh"
        [ -f "$TDP" ] || { echo "::error::$TDP not found"; exit 1; }

        if [ "$USE_REPO_DEPS" = "true" ]; then
          echo ">>> Dependencies fetched from https://xodiosx.github.io/Termux-pkg-x"
        else
          echo ">>> Forcing source builds of all dependencies"
          if ! grep -q 'FORCED-BY-CI-FORCE-SOURCE-BUILD' "$TDP"; then
            sed -i '/^termux_download_deb_pac() {/a\    # FORCED-BY-CI-FORCE-SOURCE-BUILD: return failure' "$TDP"
            sed -i '/FORCED-BY-CI-FORCE-SOURCE-BUILD: return failure/a\    return 1' "$TDP"
          fi
        fi

    - name: Gather build summary
      id: build-info
      env:
        MANUAL_INPUT_PACKAGES: ${{ github.event.inputs.packages }}
      run: |
        set -euo pipefail
        mkdir -p ./artifacts ./debs ./output
        touch ./debs/.placeholder

        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          read -a PACKAGES <<< "${MANUAL_INPUT_PACKAGES//$'\n'/ }"
          repo_paths=$(jq --raw-output 'del(.pkg_format) | keys | .[]' repo.json)
          declare -a resolved=()
          for pkg in "${PACKAGES[@]}"; do
            if [ -z "$pkg" ]; then continue; fi
            case "$pkg" in
              vkmark)
                echo "::warning::Skipping '$pkg'"
                continue
                ;;
            esac
            for repo_path in $repo_paths; do
              repo=$(jq --raw-output '.["'${repo_path}'"].name' repo.json)
              if [ -d "${repo_path}/${pkg}" ]; then
                echo "$pkg" >> "./built_${repo}_packages.txt"
                for subpkg in $(find "${repo_path}/${pkg}/" -maxdepth 1 -type f -name '*.subpackage.sh' | sort); do
                  echo "$(basename "${subpkg%%.subpackage.sh}")" >> "./built_${repo}_subpackages.txt"
                done
                resolved+=("$pkg")
                break
              fi
            done
          done
          echo ">>> resolved ${#resolved[@]}: ${resolved[*]:-<none>}"
          if [ "${#resolved[@]}" -eq 0 ]; then
            echo "::error::None found."
            exit 1
          fi
        fi

    - name: Lint packages
      run: |
        set -euo pipefail
        declare -a package_recipes=()
        for repo_path in $(jq --raw-output 'del(.pkg_format) | keys | .[]' repo.json); do
          repo=$(jq --raw-output '.["'${repo_path}'"].name' repo.json)
          if [ -f "./built_${repo}_packages.txt" ]; then
            while read -r p; do
              if [ -n "$p" ]; then package_recipes+=("${repo_path}/${p}/build.sh"); fi
            done < "./built_${repo}_packages.txt"
          fi
        done
        if [ "${#package_recipes[@]}" -gt 0 ]; then
          ./scripts/lint-packages.sh "${package_recipes[@]}"
        fi

    - name: Enable zram
      uses: ./.github/actions/zram
      with:
        algorithm: zstd
        size: 16G
        priority: 100
        device_name: /dev/zram0

    - name: Load Docker image
      if: ${{ steps.build-info.outputs.free-space == 'true' }}
      run: ./scripts/run-docker.sh true

    - name: Free additional disk space
      if: ${{ steps.build-info.outputs.free-space == 'true' }}
      run: ./scripts/free-space.sh

    - name: Build packages
      run: |
        set -euo pipefail
        declare -a packages=()
        for repo_path in $(jq --raw-output 'del(.pkg_format) | keys | .[]' repo.json); do
          repo=$(jq --raw-output '.["'${repo_path}'"].name' repo.json)
          if [ -f "./built_${repo}_packages.txt" ]; then
            while read -r p; do
              if [ -n "$p" ]; then packages+=("$p"); fi
            done < "./built_${repo}_packages.txt"
          fi
        done
        PKGS_STR="${packages[*]}"
        echo ">>> packages to build (${#packages[@]}): ${PKGS_STR}"

        if [ "${#packages[@]}" -eq 0 ]; then
          echo ">>> no packages — nothing to do"
          exit 0
        fi

        {
          echo 'set -uo pipefail'
          echo 'PREFIX=/data/data/app.xodos2/files/usr'
          echo 'BUILD_ROOT=/home/builder/termux-packages'
          echo 'mkdir -p "$PREFIX/var/lib/dpkg/info"'
          echo 'cd "$BUILD_ROOT"'
          echo ''
          echo 'echo ">>> wiping stale built-packages markers"'
          echo 'rm -rf /data/data/.built-packages 2>/dev/null || true'
          echo 'rm -rf /data/data/app.xodos2/.built-packages 2>/dev/null || true'
          echo 'rm -rf /data/data/app.xodos2/files/.built-packages 2>/dev/null || true'
          echo ''
          echo 'declare -a failed=()'
          echo 'declare -a built=()'
          echo "for pkg in ${PKGS_STR}; do"
          echo '  echo "=================================================="'
          echo '  echo ">>> Building: $pkg"'
          echo '  echo "=================================================="'
          echo '  if ./build-package.sh -C -f -a aarch64 "$pkg"; then'
          echo '    built+=("$pkg")'
          echo '    echo ">>> OK: $pkg"'
          echo '  else'
          echo '    failed+=("$pkg")'
          echo '    echo ">>> FAILED: $pkg"'
          echo '  fi'
          echo 'done'
          echo 'echo ""'
          echo 'echo "=================================================="'
          echo "echo \">>> built \${#built[@]}: \${built[*]:-<none>}\""
          echo "echo \">>> failed \${#failed[@]}: \${failed[*]:-<none>}\""
          echo 'echo "=================================================="'
          echo 'if [ "${#failed[@]}" -gt 0 ]; then exit 2; fi'
        } > /tmp/inner-build.sh

        cat /tmp/inner-build.sh
        ENCODED=$(base64 -w0 /tmp/inner-build.sh)
        ./scripts/run-docker.sh -d bash -c "echo '${ENCODED}' | base64 -d | bash" || true

    - name: Generate build artifacts
      if: always()
      run: |
        set -uo pipefail
        mkdir -p debs artifacts output

        if [ -d termux-packages/output ]; then
          find termux-packages/output -maxdepth 1 -type f -print0 2>/dev/null \
            | xargs -0r mv -t ./output/ 2>/dev/null || true
        fi

        find output -maxdepth 1 -type f -name '*.deb' -print0 2>/dev/null \
          | xargs -0r mv -t debs/ 2>/dev/null || true

        for repo in $(jq --raw-output 'del(.pkg_format) | .[].name' repo.json); do
          if [ -f "./built_${repo}_packages.txt" ]; then
            mv "./built_${repo}_packages.txt" ./debs/ || true
          fi
          if [ -f "./built_${repo}_subpackages.txt" ]; then
            cat "./built_${repo}_subpackages.txt" >> "./debs/built_${repo}_packages.txt" 2>/dev/null || true
            rm -f "./built_${repo}_subpackages.txt"
          fi
        done

        n=$(find debs -type f -name '*.deb' 2>/dev/null | wc -l)
        echo ">>> debs/ contains: ${n} .deb files"

        tar cf "artifacts/debs-${{ matrix.target_arch }}-${{ github.sha }}.tar" debs
        tar tf "artifacts/debs-${{ matrix.target_arch }}-${{ github.sha }}.tar" | head -20 || true

    - name: Store *.deb files
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: debs-${{ matrix.target_arch }}-${{ github.sha }}
        path: ./artifacts

  release:
    permissions:
      contents: write
    needs: [build, prepare-release]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - uses: actions/checkout@v6
      with: { fetch-depth: 1 }

    - uses: actions/download-artifact@v6
      with: { path: ./all-artifacts }

    - name: Extract .deb files from tarballs
      run: |
        set -euo pipefail
        mkdir -p release-debs

        echo ">>> downloaded artifacts tree:"
        find all-artifacts -maxdepth 4 -type f | head -40 || true

        mapfile -t ARCHIVES < <(find all-artifacts -type f -name 'debs-*.tar' 2>/dev/null || true)
        echo ">>> found ${#ARCHIVES[@]} tar archive(s)"

        if [ "${#ARCHIVES[@]}" -eq 0 ]; then
          echo "::error::No debs-*.tar files under all-artifacts/"
          find all-artifacts -maxdepth 4 -type f || true
          exit 1
        fi

        for archive in "${ARCHIVES[@]}"; do
          echo ">>> extracting $archive"
          tar xf "$archive" -C release-debs
        done

        count=$(find release-debs -type f -name '*.deb' | wc -l)
        echo ">>> found ${count} .deb files"
        if [ "$count" -eq 0 ]; then
          echo "::error::No .deb files found inside the extracted tars"
          find release-debs -maxdepth 3 -type f | head -30 || true
          exit 1
        fi

    - name: Upload .deb files
      run: |
        set -euo pipefail
        TAG="${{ needs.prepare-release.outputs.tag }}"
        mapfile -t FILES < <(find release-debs -type f -name '*.deb' | sort)
        total="${#FILES[@]}"
        i=0
        failed=0
        for f in "${FILES[@]}"; do
          i=$((i + 1))
          printf '[%d/%d] %s ... ' "$i" "$total" "$(basename "$f")"
          ok=0
          for attempt in 1 2 3 4 5; do
            if gh release upload "$TAG" "$f" --clobber 2>/tmp/gh_err.log; then
              ok=1
              break
            fi
            if grep -qiE 'secondary rate limit|abuse|rate limit' /tmp/gh_err.log; then
              backoff=$((attempt * 15))
            else
              backoff=$((attempt * 3))
            fi
            sleep "$backoff"
          done
          if [ "$ok" -eq 1 ]; then echo ok; else echo "FAILED: $(basename "$f")"; failed=$((failed + 1)); fi
          sleep 1
        done
        if [ "$failed" -gt 0 ]; then
          echo "::error::${failed}/${total} failed"
          exit 1
        fi
        echo ">>> all ${total} uploaded"

    - name: Verify release assets
      run: |
        TAG="${{ needs.prepare-release.outputs.tag }}"
        count=$(gh release view "$TAG" --json assets --jq '.assets | length')
        echo ">>> release ${TAG} has ${count} assets"
