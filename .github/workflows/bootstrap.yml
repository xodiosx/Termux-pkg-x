name: Generate bootstrap XoDos

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:
    inputs:
      hf_repo_id:
        description: "HF dataset repo (username/repo-name)"
        required: true
        default: "xodiosx/xodos-packages"
      arch:
        description: "Arch"
        required: false
        default: "aarch64"

permissions:
  contents: write

concurrency:
  group: generate-bootstrap
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        arch: [aarch64]
      fail-fast: false
    env:
      HF_REPO: ${{ inputs.hf_repo_id }}
      HF_BASE: "https://huggingface.co/datasets/${{ inputs.hf_repo_id }}/resolve/main"
      ARCH: ${{ matrix.arch }}

    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dpkg-dev python3 curl gzip xz-utils
          pip install -q --upgrade "huggingface_hub<1.0"

      - name: Fetch Packages + list HF files
        run: |
          set -euo pipefail
          mkdir -p work

          url="${HF_BASE}/xodos-main/dists/stable/main/binary-aarch64/Packages.gz"
          echo ">>> fetching $url"
          curl -fsSL --retry 4 --retry-delay 3 --max-time 120 \
            -o work/Packages.gz "$url" \
            || { echo "::error::cannot fetch Packages.gz"; exit 1; }
          gunzip -f work/Packages.gz
          echo ">>> Packages entries: $(grep -c '^Package:' work/Packages || true)"

          cat > /tmp/list_hf.py <<'PYEOF'
          import os
          from huggingface_hub import HfApi
          api = HfApi()
          files = api.list_repo_files(
              repo_id=os.environ["HF_REPO"],
              repo_type="dataset",
          )
          debs = [f for f in files if f.endswith(".deb") and "/" not in f]
          print(">>> HF files total:", len(files), "| .deb at root:", len(debs))
          with open("work/hf-debs.txt", "w") as fh:
              for f in sorted(debs):
                  fh.write(f + "\n")
          PYEOF
          python3 /tmp/list_hf.py

          if [ ! -s work/hf-debs.txt ]; then
            echo "::error::No .deb files at HF root — run sync-to-hf first"
            exit 1
          fi
          echo ">>> sample HF .deb names:"
          head -10 work/hf-debs.txt | sed 's/^/    /'

      - name: Resolve and download .deb files
        run: |
          set -euo pipefail
          mkdir -p debs

          cat > /tmp/download.py <<'PYEOF'
          import os, re, sys, urllib.parse, urllib.request, shutil
          from pathlib import Path

          ARCH    = os.environ["ARCH"]
          HF_BASE = os.environ["HF_BASE"].rstrip("/")

          essentials = [
              "apt", "dpkg",
              "bash", "dash",
              "coreutils", "findutils", "grep", "sed", "gawk",
              "diffutils", "patch", "ed", "less", "nano",
              "tar", "gzip", "bzip2", "xz-utils", "zstd", "unzip",
              "curl", "openssl", "openssl-tool", "ca-certificates",
              "resolv-conf", "inetutils",
              "procps", "psmisc", "util-linux",
              "ncurses", "ncurses-utils", "readline", "bash-completion",
              "termux-am", "termux-am-socket", "termux-core",
              "termux-exec", "termux-licenses", "termux-tools",
              "libandroid-support", "libc++", "zlib",
          ]

          def parse_list(raw):
              out = []
              for part in raw.split(","):
                  part = part.strip()
                  if not part:
                      continue
                  first = part.split("|")[0].strip()
                  first = first.split("(")[0].strip()
                  if first:
                      out.append(first)
              return out

          # ---- Parse Packages ----
          info = {}
          provides = {}
          cur = {}
          for line in open("work/Packages"):
              line = line.rstrip("\n")
              if not line:
                  if cur.get("Package"):
                      name = cur["Package"]
                      info[name] = cur
                      for p in parse_list(cur.get("Provides", "")):
                          provides.setdefault(p, []).append(name)
                  cur = {}
                  continue
              m = re.match(r"^([A-Za-z0-9_-]+):\s*(.*)$", line)
              if m:
                  key, val = m.group(1), m.group(2)
                  if key == "Depends" and "Depends" in cur:
                      cur["Depends"] += ", " + val
                  else:
                      cur[key] = val
          if cur.get("Package"):
              name = cur["Package"]
              info[name] = cur
              for p in parse_list(cur.get("Provides", "")):
                  provides.setdefault(p, []).append(name)

          print(">>> parsed", len(info), "packages from Packages")

          # ---- Resolve closure ----
          needed, queue = set(), []
          for e in essentials:
              if e in info and e not in needed:
                  needed.add(e); queue.append(e)
              elif e in provides:
                  for real in provides[e]:
                      if real not in needed:
                          needed.add(real); queue.append(real)

          while queue:
              cur_name = queue.pop()
              entry = info.get(cur_name)
              if not entry:
                  continue
              for dep in parse_list(entry.get("Depends", "")):
                  targets = [dep] if dep in info else provides.get(dep, [])
                  for t in targets:
                      if t not in needed:
                          needed.add(t); queue.append(t)

          keep = []
          for name in sorted(needed):
              entry = info[name]
              arch = entry.get("Architecture", "")
              if arch == "all" or arch == ARCH:
                  keep.append(name)

          print(">>> keeping", len(keep), "packages for arch", ARCH)
          print(">>> sample:", ", ".join(keep[:25]))

          # ---- Match against HF files ----
          hf_files = [l.strip() for l in open("work/hf-debs.txt") if l.strip()]
          by_pkg = {}
          for f in hf_files:
              if "_" not in f:
                  continue
              pkg = f.split("_", 1)[0]
              by_pkg.setdefault(pkg, []).append(f)

          print(">>> HF map:", len(by_pkg), "distinct package names")

          def pick_file(pkg):
              cands = by_pkg.get(pkg, [])
              if not cands:
                  return None
              arch_c = [c for c in cands if ("_" + ARCH + ".deb") in c]
              if not arch_c:
                  arch_c = [c for c in cands if "_all.deb" in c]
              if not arch_c:
                  return None
              return sorted(arch_c)[-1]

          # ---- Download ----
          os.makedirs("debs", exist_ok=True)

          def fetch(url, out):
              if out.exists() and out.stat().st_size > 0:
                  return True
              try:
                  with urllib.request.urlopen(url, timeout=300) as r, open(out, "wb") as f:
                      shutil.copyfileobj(r, f)
                  return True
              except Exception as e:
                  print("    FAIL", url, ":", e)
                  if out.exists():
                      out.unlink()
                  return False

          ok = 0
          missing = []
          for pkg in keep:
              fname = pick_file(pkg)
              if not fname:
                  missing.append((pkg, "no .deb matching on HF"))
                  continue
              encoded = urllib.parse.quote(fname, safe="")
              url = HF_BASE + "/" + encoded
              out = Path("debs") / fname
              if fetch(url, out):
                  ok += 1
              else:
                  missing.append((pkg, fname))

          print(">>> downloaded:", ok, "| missing:", len(missing))
          for m in missing[:30]:
              print("    MISS", m[0], ":", m[1])

          if ok == 0:
              sys.exit("::error::nothing downloaded — check HF .deb files")

          with open("selected.txt", "w") as fh:
              for pkg in keep:
                  fh.write(pkg + "\n")
          PYEOF
          python3 /tmp/download.py

          echo ">>> debs dir size:"
          du -sh debs
          echo ">>> .deb count:"
          find debs -maxdepth 1 -name '*.deb' | wc -l

      - name: Extract into staging
        run: |
          set -euo pipefail
          STAGING=staging
          rm -rf "$STAGING"
          mkdir -p "$STAGING"

          shopt -s nullglob
          for deb in debs/*.deb; do
            [ -f "$deb" ] || continue
            tmpdir=$(mktemp -d)
            if ! dpkg-deb -x "$deb" "$tmpdir" 2>/dev/null; then
              echo ">>> skip invalid: $(basename "$deb")"
              rm -rf "$tmpdir"; continue
            fi
            prefix_dir="$tmpdir/data/data/app.xodos2/files/usr"
            if [ ! -d "$prefix_dir" ]; then
              prefix_dir="$tmpdir/data/data/com.termux/files/usr"
            fi
            if [ -d "$prefix_dir" ]; then
              cp -a "$prefix_dir/." "$STAGING/"
            fi
            rm -rf "$tmpdir"
          done
          shopt -u nullglob

          echo ">>> staging size: $(du -sh "$STAGING" | awk '{print $1}')"

      - name: Overwrite sources.list
        run: |
          set -euo pipefail
          mkdir -p staging/etc/apt/sources.list.d
          rm -f staging/etc/apt/sources.list
          rm -f staging/etc/apt/sources.list.d/*.list 2>/dev/null || true

          {
            echo 'deb [trusted=yes] https://huggingface.co/datasets/xodiosx/xodos-packages/resolve/main/xodos-main stable main'
            echo 'deb [trusted=yes] https://huggingface.co/datasets/xodiosx/xodos-packages/resolve/main/xodos-x11 x11 main'
            echo 'deb [trusted=yes] https://huggingface.co/datasets/xodiosx/xodos-packages/resolve/main/xodos-root root stable'
            echo 'deb [trusted=yes] https://huggingface.co/datasets/xodiosx/xodos-packages/resolve/main/xodos-glibc glibc main'
            echo 'deb [trusted=yes] https://huggingface.co/datasets/xodiosx/xodos-packages/resolve/main/xodos-tur tur-packages tur tur-on-device tur-continuous'
          } > staging/etc/apt/sources.list
          cat staging/etc/apt/sources.list

      - name: Replace pkg with thin apt wrapper
        run: |
          set -euo pipefail
          {
            echo '#!/data/data/app.xodos2/files/usr/bin/bash'
            echo 'TERMUX_PREFIX=/data/data/app.xodos2/files/usr'
            echo 'export PATH="$TERMUX_PREFIX/bin:$PATH"'
            echo 'export TERMUX_PREFIX'
            echo 'CMD="$1"'
            echo 'shift 2>/dev/null || true'
            echo 'case "$CMD" in'
            echo '  up|update) exec apt update "$@" ;;'
            echo '  upgrade) exec apt upgrade "$@" ;;'
            echo '  full-upgrade) exec apt full-upgrade "$@" ;;'
            echo '  install) exec apt install "$@" ;;'
            echo '  reinstall) exec apt install --reinstall "$@" ;;'
            echo '  downgrade) exec apt install --allow-downgrades "$@" ;;'
            echo '  uninstall|remove) exec apt remove "$@" ;;'
            echo '  purge) exec apt purge "$@" ;;'
            echo '  autoremove) exec apt autoremove "$@" ;;'
            echo '  autoclean) exec apt autoclean "$@" ;;'
            echo '  clean) exec apt clean "$@" ;;'
            echo '  list) exec apt list "$@" ;;'
            echo '  list-all) exec apt list --all-versions "$@" ;;'
            echo '  list-installed) exec apt list --installed "$@" ;;'
            echo '  list-upgradable) exec apt list --upgradable "$@" ;;'
            echo '  search) exec apt search "$@" ;;'
            echo '  show) exec apt show "$@" ;;'
            echo '  files) exec dpkg -L "$@" ;;'
            echo '  hold|unhold) exec apt-mark "$CMD" "$@" ;;'
            echo '  ""|help|-h|--help)'
            echo '    echo "Usage: pkg <command> [args]"'
            echo '    ;;'
            echo '  *) echo "pkg: unknown command: $CMD" >&2; exit 1 ;;'
            echo 'esac'
          } > staging/bin/pkg
          chmod 0755 staging/bin/pkg
          echo ">>> pkg header:"
          head -3 staging/bin/pkg

      - name: Wipe mirrors dir + termux-change-repo
        run: |
          set -euo pipefail
          rm -rf staging/etc/termux/mirrors
          rm -f  staging/bin/termux-change-repo
          rmdir staging/etc/termux 2>/dev/null || true

      - name: Strip keyring + write insecure config
        run: |
          set -euo pipefail
          rm -rf staging/etc/apt/trusted.gpg.d 2>/dev/null || true
          rm -rf staging/share/termux-keyring   2>/dev/null || true
          rm -rf staging/etc/termux-keyring     2>/dev/null || true

          mkdir -p staging/etc/apt/apt.conf.d
          {
            echo 'Acquire::AllowInsecureRepositories "true";'
            echo 'Acquire::AllowDowngradeToInsecureRepositories "true";'
            echo 'APT::Get::AllowUnauthenticated "true";'
          } > staging/etc/apt/apt.conf.d/99-insecure

      - name: Fix any remaining com.termux paths
        run: |
          set -euo pipefail
          mapfile -t files < <(grep -rl '/data/data/com\.termux' staging/ 2>/dev/null || true)
          if [ "${#files[@]}" -eq 0 ]; then
            echo ">>> no /data/data/com.termux references"
            exit 0
          fi
          for f in "${files[@]}"; do
            sed -i 's|/data/data/com\.termux|/data/data/app.xodos2|g' "$f"
          done

      - name: Create tar.xz
        run: |
          set -euo pipefail
          cd staging
          tar --numeric-owner -cJf "../bootstrap-${ARCH}.tar.xz" .
          cd ..
          ls -la "bootstrap-${ARCH}.tar.xz"
          echo ">>> compressed: $(du -h "bootstrap-${ARCH}.tar.xz" | awk '{print $1}')"
          sha256sum "bootstrap-${ARCH}.tar.xz" > "bootstrap-${ARCH}.tar.xz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: bootstrap-${{ matrix.arch }}-${{ github.sha }}
          path: |
            bootstrap-*.tar.xz
            bootstrap-*.tar.xz.sha256

  publish:
    needs: [build]
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/download-artifact@v6
        with:
          merge-multiple: true
          path: ./

      - name: Create release
        id: tag
        run: |
          set -euo pipefail
          TAG="bootstrap-$(date -u +'%Y.%m.%d-%H%M%S')"
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "Bootstrap archives $TAG" \
            --notes "Prebuilt app.xodos2 bootstrap (plain .tar.xz)." \
            --target "${{ github.sha }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Upload bootstrap archives
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          shopt -s nullglob
          files=(bootstrap-*.tar.xz bootstrap-*.tar.xz.sha256)
          for f in "${files[@]}"; do
            echo ">>> uploading $f"
            gh release upload "$TAG" "$f" --repo "${{ github.repository }}" --clobber
          done
          gh release view "$TAG" --repo "${{ github.repository }}" --json assets --jq '.assets[].name'
