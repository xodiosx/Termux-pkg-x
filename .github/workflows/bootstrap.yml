name: Generate bootstrap XoDos

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:
    inputs:
      hf_repo_id:
        description: "HF dataset repo (username/repo-name)"
        required: true
        default: "xodiosx/xodos-packages"
      arch:
        description: "Comma-separated arch list, or 'all'"
        required: false
        default: "aarch64"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        arch: [aarch64]
      fail-fast: false
    env:
      HF_REPO: ${{ inputs.hf_repo_id }}
      HF_BASE: "https://huggingface.co/datasets/${{ inputs.hf_repo_id }}/resolve/main"
      ARCH: ${{ matrix.arch }}

    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dpkg-dev python3 curl gzip xz-utils

      # ==================================================================
      # 1. Fetch authoritative Packages index from HF
      # ==================================================================
      - name: Fetch Packages index from HF
        run: |
          set -euo pipefail
          mkdir -p work
          url="${HF_BASE}/xodos-main/dists/stable/main/binary-aarch64/Packages.gz"
          echo ">>> fetching $url"
          curl -fsSL --retry 4 --retry-delay 3 --max-time 120 \
            -o work/Packages.gz "$url" \
            || { echo "::error::cannot fetch Packages.gz from HF"; exit 1; }

          gunzip -f work/Packages.gz
          n=$(grep -c '^Package:' work/Packages || true)
          echo ">>> Packages entries: $n"
          [ "$n" -gt 0 ] || { echo "::error::Packages is empty"; exit 1; }

      # ==================================================================
      # 2. Resolve minimal closure from HF Packages
      # ==================================================================
      - name: Resolve dependency closure
        run: |
          set -euo pipefail

          cat > /tmp/resolve.py <<'PYEOF'
          import re, sys, os

          ARCH = os.environ["ARCH"]
          pkgfile = "work/Packages"

          essentials = [
              "apt", "dpkg",
              "bash", "dash",
              "coreutils", "findutils", "grep", "sed", "gawk",
              "diffutils", "patch", "ed", "less", "nano",
              "tar", "gzip", "bzip2", "xz-utils", "zstd", "unzip",
              "curl", "openssl", "openssl-tool", "ca-certificates",
              "resolv-conf", "inetutils",
              "procps", "psmisc", "util-linux",
              "ncurses", "ncurses-utils", "readline", "bash-completion",
              "termux-am", "termux-am-socket", "termux-core",
              "termux-exec", "termux-licenses", "termux-tools",
              "libandroid-support", "libc++", "zlib",
          ]

          def parse_list(raw):
              out = []
              for part in raw.split(","):
                  part = part.strip()
                  if not part:
                      continue
                  first = part.split("|")[0].strip()
                  first = first.split("(")[0].strip()
                  if first:
                      out.append(first)
              return out

          # Parse all Packages blocks
          info = {}
          provides = {}
          cur = {}
          for line in open(pkgfile):
              line = line.rstrip("\n")
              if not line:
                  if cur.get("Package"):
                      name = cur["Package"]
                      info[name] = cur
                      for p in parse_list(cur.get("Provides", "")):
                          provides.setdefault(p, []).append(name)
                  cur = {}
                  continue
              m = re.match(r'^([A-Za-z0-9_-]+):\s*(.*)$', line)
              if m:
                  key, val = m.group(1), m.group(2)
                  if key == "Depends" and "Depends" in cur:
                      cur["Depends"] += ", " + val
                  else:
                      cur[key] = val
          if cur.get("Package"):
              name = cur["Package"]
              info[name] = cur
              for p in parse_list(cur.get("Provides", "")):
                  provides.setdefault(p, []).append(name)

          print(f">>> parsed {len(info)} packages")

          needed, queue = set(), []
          for e in essentials:
              if e in info and e not in needed:
                  needed.add(e); queue.append(e)
              elif e in provides:
                  for real in provides[e]:
                      if real not in needed:
                          needed.add(real); queue.append(real)

          while queue:
              cur_name = queue.pop()
              entry = info.get(cur_name)
              if not entry:
                  continue
              for dep in parse_list(entry.get("Depends", "")):
                  targets = [dep] if dep in info else provides.get(dep, [])
                  for t in targets:
                      if t not in needed:
                          needed.add(t); queue.append(t)

          keep = []
          for name in sorted(needed):
              entry = info[name]
              arch = entry.get("Architecture", "")
              if arch == "all" or arch == ARCH:
                  keep.append(name)

          print(f">>> keeping {len(keep)} packages for arch {ARCH}")

          missing = []
          for name in keep:
              for dep in parse_list(info[name].get("Depends", "")):
                  if dep not in info and dep not in provides:
                      missing.append(f"{name} -> {dep}")
          if missing:
              print(f">>> WARNING: {len(missing)} unresolvable dep(s):")
              for m in missing[:20]:
                  print(f"    {m}")

          with open("selected.txt", "w") as fh:
              for name in keep:
                  fh.write(name + "\n")

          print(">>> sample:", ", ".join(keep[:25]))
          PYEOF

          python3 /tmp/resolve.py
          wc -l selected.txt

      # ==================================================================
      # 3. Download needed .deb files FROM HUGGING FACE
      # ==================================================================
      - name: Download .deb files from Hugging Face
        run: |
          set -euo pipefail
          mkdir -p debs
          : > debs/.placeholder

          # Build name -> Filename map from Packages
          awk '
            /^Package: / { pkg=substr($0,10) }
            /^Filename: / { print pkg "\t" substr($0,11) }
          ' work/Packages > work/name-to-file.tsv

          echo ">>> mapping entries: $(wc -l < work/name-to-file.tsv)"

          kept=0
          missing=0
          while read -r pkg; do
            [ -z "$pkg" ] && continue
            fname=$(awk -F'\t' -v p="$pkg" '$1==p {print $2; exit}' work/name-to-file.tsv)
            if [ -z "$fname" ]; then
              echo ">>> WARN: no Filename for $pkg"
              missing=$((missing+1))
              continue
            fi

            # Filename is a flat basename in our HF layout
            fname=$(basename "$fname")
            url="${HF_BASE}/${fname}"
            out="debs/${fname}"

            if [ -s "$out" ]; then
              kept=$((kept+1))
              continue
            fi

            if curl -fsSL --retry 3 --retry-delay 2 --max-time 300 \
                    -o "$out" "$url"; then
              kept=$((kept+1))
            else
              echo ">>> FAIL: $url"
              missing=$((missing+1))
              rm -f "$out"
            fi
          done < selected.txt

          echo ">>> downloaded: $kept, missing: $missing"
          du -sh debs
          [ "$kept" -gt 0 ] || { echo "::error::nothing downloaded"; exit 1; }

      # ==================================================================
      # 4. Extract prefix data into staging
      # ==================================================================
      - name: Extract into staging
        run: |
          set -euo pipefail
          STAGING=staging
          rm -rf "$STAGING"
          mkdir -p "$STAGING"

          shopt -s nullglob
          for deb in debs/*.deb; do
            [ -f "$deb" ] || continue
            tmpdir=$(mktemp -d)
            if ! dpkg-deb -x "$deb" "$tmpdir" 2>/dev/null; then
              rm -rf "$tmpdir"; continue
            fi
            prefix_dir="$tmpdir/data/data/app.xodos2/files/usr"
            if [ ! -d "$prefix_dir" ]; then
              prefix_dir="$tmpdir/data/data/com.termux/files/usr"
            fi
            if [ -d "$prefix_dir" ]; then
              cp -a "$prefix_dir/." "$STAGING/"
            fi
            rm -rf "$tmpdir"
          done
          shopt -u nullglob

          echo ">>> staging size: $(du -sh "$STAGING" | awk '{print $1}')"

      # ==================================================================
      # 5. Force-patch every config file — do not trust the source .deb
      # ==================================================================

      - name: Overwrite sources.list
        run: |
          set -euo pipefail
          mkdir -p staging/etc/apt/sources.list.d
          rm -f staging/etc/apt/sources.list
          rm -f staging/etc/apt/sources.list.d/*.list 2>/dev/null || true

          {
            echo 'deb [trusted=yes] https://huggingface.co/datasets/xodiosx/xodos-packages/resolve/main/xodos-main stable main'
            echo 'deb [trusted=yes] https://huggingface.co/datasets/xodiosx/xodos-packages/resolve/main/xodos-x11 x11 main'
            echo 'deb [trusted=yes] https://huggingface.co/datasets/xodiosx/xodos-packages/resolve/main/xodos-root root stable'
            echo 'deb [trusted=yes] https://huggingface.co/datasets/xodiosx/xodos-packages/resolve/main/xodos-glibc glibc main'
            echo 'deb [trusted=yes] https://huggingface.co/datasets/xodiosx/xodos-packages/resolve/main/xodos-tur tur-packages tur tur-on-device tur-continuous'
          } > staging/etc/apt/sources.list

          cat staging/etc/apt/sources.list

      - name: Replace pkg with thin apt wrapper
        run: |
          set -euo pipefail
          cat > staging/bin/pkg <<'EOF'
          #!/data/data/app.xodos2/files/usr/bin/bash
          TERMUX_PREFIX=/data/data/app.xodos2/files/usr
          export PATH="$TERMUX_PREFIX/bin:$PATH"
          export TERMUX_PREFIX
          CMD="$1"
          shift 2>/dev/null || true
          case "$CMD" in
            up|update) exec apt update "$@" ;;
            upgrade) exec apt upgrade "$@" ;;
            full-upgrade) exec apt full-upgrade "$@" ;;
            install) exec apt install "$@" ;;
            reinstall) exec apt install --reinstall "$@" ;;
            downgrade) exec apt install --allow-downgrades "$@" ;;
            uninstall|remove) exec apt remove "$@" ;;
            purge) exec apt purge "$@" ;;
            autoremove) exec apt autoremove "$@" ;;
            autoclean) exec apt autoclean "$@" ;;
            clean) exec apt clean "$@" ;;
            list) exec apt list "$@" ;;
            list-all) exec apt list --all-versions "$@" ;;
            list-installed) exec apt list --installed "$@" ;;
            list-upgradable) exec apt list --upgradable "$@" ;;
            search) exec apt search "$@" ;;
            show) exec apt show "$@" ;;
            files) exec dpkg -L "$@" ;;
            hold|unhold) exec apt-mark "$CMD" "$@" ;;
            ""|help|-h|--help)
              echo "Usage: pkg <command> [args]"
              echo "Commands: up upgrade full-upgrade install reinstall remove"
              echo "          purge autoremove clean list list-all list-installed"
              echo "          list-upgradable search show files hold unhold"
              ;;
            *) echo "pkg: unknown command '$CMD'" >&2; exit 1 ;;
          esac
          EOF
          chmod 0755 staging/bin/pkg
          echo ">>> pkg replaced. Header:"
          head -3 staging/bin/pkg

      - name: Wipe mirrors dir + termux-change-repo
        run: |
          set -euo pipefail
          # The pkg wrapper we just wrote doesn't consult mirrors, so
          # the whole mirrors tree is dead weight. Remove it and drop
          # termux-change-repo.
          rm -rf staging/etc/termux/mirrors
          rm -f  staging/bin/termux-change-repo
          rmdir staging/etc/termux 2>/dev/null || true

          echo ">>> leftover in staging/etc:"
          find staging/etc -maxdepth 2 -type f | head -20

      - name: Strip keyring + write insecure config
        run: |
          set -euo pipefail
          rm -rf staging/etc/apt/trusted.gpg.d 2>/dev/null || true
          rm -rf staging/share/termux-keyring   2>/dev/null || true
          rm -rf staging/etc/termux-keyring     2>/dev/null || true

          mkdir -p staging/etc/apt/apt.conf.d
          {
            echo 'Acquire::AllowInsecureRepositories "true";'
            echo 'Acquire::AllowDowngradeToInsecureRepositories "true";'
            echo 'APT::Get::AllowUnauthenticated "true";'
          } > staging/etc/apt/apt.conf.d/99-insecure

      - name: Fix any remaining com.termux paths
        run: |
          set -euo pipefail
          mapfile -t files < <(grep -rl '/data/data/com\.termux' staging/ 2>/dev/null || true)
          if [ "${#files[@]}" -eq 0 ]; then
            echo ">>> no /data/data/com.termux references"
            exit 0
          fi
          for f in "${files[@]}"; do
            sed -i 's|/data/data/com\.termux|/data/data/app.xodos2|g' "$f"
          done

      # ==================================================================
      # 6. Pack
      # ==================================================================
      - name: Create tar.xz
        run: |
          set -euo pipefail
          cd staging
          tar --numeric-owner -cJf "../bootstrap-${ARCH}.tar.xz" .
          cd ..
          ls -la "bootstrap-${ARCH}.tar.xz"
          echo ">>> compressed size: $(du -h "bootstrap-${ARCH}.tar.xz" | awk '{print $1}')"
          sha256sum "bootstrap-${ARCH}.tar.xz" > "bootstrap-${ARCH}.tar.xz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: bootstrap-${{ matrix.arch }}-${{ github.sha }}
          path: |
            bootstrap-*.tar.xz
            bootstrap-*.tar.xz.sha256

  publish:
    needs: [build]
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/download-artifact@v6
        with:
          merge-multiple: true
          path: ./

      - name: Create release
        id: tag
        run: |
          set -euo pipefail
          TAG="bootstrap-$(date -u +'%Y.%m.%d-%H%M%S')"
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "Bootstrap archives $TAG" \
            --notes "Prebuilt app.xodos2 bootstrap (plain .tar.xz).

          Source: Hugging Face (xodos-main).
          Patched: sources.list, pkg wrapper, mirrors removed, keyring stripped.
          Extract directly into \$PREFIX." \
            --target "${{ github.sha }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Upload bootstrap archives
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          shopt -s nullglob
          files=(bootstrap-*.tar.xz bootstrap-*.tar.xz.sha256)
          for f in "${files[@]}"; do
            echo ">>> uploading $f"
            gh release upload "$TAG" "$f" --repo "${{ github.repository }}" --clobber
          done
          gh release view "$TAG" --repo "${{ github.repository }}" --json assets --jq '.assets[].name'
