name: Generate bootstrap XoDos

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to pull .deb files from (leave empty for latest)"
        required: false
        default: ""
      arch:
        description: "Comma-separated arch list, or 'all'"
        required: false
        default: "aarch64"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      archs: ${{ steps.pick.outputs.archs }}
    steps:
      - name: Pick release tag + arches
        id: pick
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.release_tag }}
          INPUT_ARCH: ${{ inputs.arch }}
        run: |
          set -euo pipefail

          count_debs() {
            local tag="$1"
            local n
            n=$(gh release view "$tag" --repo "${{ github.repository }}" \
                  --json assets \
                  --jq '[.assets[]?.name // empty] | map(select(endswith(".deb"))) | length' \
                  2>/dev/null || echo "0")
            echo "${n:-0}"
          }

          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
            count=$(count_debs "$TAG")
            echo ">>> user-provided tag: $TAG ($count .deb)"
            if [ "${count:-0}" -eq 0 ]; then
              echo "::error::Release '$TAG' has no .deb assets"
              exit 1
            fi
          else
            mapfile -t TAGS < <(
              gh release list --repo "${{ github.repository }}" --limit 200 \
                --json tagName,createdAt \
                --jq 'sort_by(.createdAt) | reverse | .[].tagName
                       | select(startswith("bootstrap-") | not)
                       | select(startswith("merged-") | not)'
            )
            if [ "${#TAGS[@]}" -eq 0 ]; then
              echo "::error::No usable releases found"
              exit 1
            fi
            TAG=""
            for t in "${TAGS[@]}"; do
              [ -z "$t" ] && continue
              c=$(count_debs "$t")
              echo "    $t -> $c .deb"
              if [ "${c:-0}" -gt 0 ]; then TAG="$t"; break; fi
            done
            [ -z "$TAG" ] && { echo "::error::No release with .deb assets"; exit 1; }
            echo ">>> picked: $TAG"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          if [ -z "$INPUT_ARCH" ] || [ "$INPUT_ARCH" = "all" ]; then
            ARCHS='["aarch64"]'
          else
            ARCHS=$(printf '%s' "$INPUT_ARCH" | python3 -c 'import sys, json; print(json.dumps([a.strip() for a in sys.stdin.read().split(",") if a.strip()]))')
          fi
          echo "archs=$ARCHS" >> "$GITHUB_OUTPUT"
          echo ">>> arches: $ARCHS"

  build:
    needs: resolve
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        arch: ${{ fromJson(needs.resolve.outputs.archs) }}
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with: { fetch-depth: 1 }

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dpkg-dev python3

      - name: Download .deb files from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          rm -rf ./all-debs
          mkdir -p ./all-debs
          gh release download "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --pattern "*.deb" \
            --dir ./all-debs
          n=$(find ./all-debs -name '*.deb' | wc -l)
          echo ">>> downloaded: $n .deb files"
          [ "$n" -eq 0 ] && { echo "::error::No .deb files in release"; exit 1; }

      # ============================================================
      # Resolve dependency closure for a MINIMAL bootstrap
      # ============================================================
      - name: Resolve dependency closure
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail

          cat > /tmp/resolve.py <<'PYEOF'
          import subprocess, os
          from collections import defaultdict

          ARCH = os.environ["ARCH"]
          deb_dir = "all-debs"

          # ---- Minimal bootstrap package list (Termux-style) ----
          essentials = [
              # Package manager
              "apt", "dpkg",
              # Shells
              "bash", "dash",
              # Core file utils
              "coreutils", "findutils", "grep", "sed", "gawk",
              "diffutils", "patch", "ed", "less", "nano",
              # Archivers
              "tar", "gzip", "bzip2", "xz-utils", "zstd", "unzip",
              # Networking + TLS
              "curl", "openssl", "openssl-tool", "ca-certificates",
              "resolv-conf", "inetutils",
              # Process / system
              "procps", "psmisc", "util-linux",
              # Terminal
              "ncurses", "ncurses-utils", "readline", "bash-completion",
              # Termux infra
              "termux-am", "termux-am-socket", "termux-core",
              "termux-exec", "termux-licenses", "termux-tools",
              # Core libs commonly referenced as "always there"
              "libandroid-support", "libc++", "zlib",
          ]

          def dpkg_field(path, field):
              try:
                  return subprocess.check_output(
                      ["dpkg-deb", "-f", path, field],
                      stderr=subprocess.DEVNULL,
                  ).decode().strip()
              except subprocess.CalledProcessError:
                  return ""

          def parse_list(raw):
              out = []
              for part in raw.split(","):
                  part = part.strip()
                  if not part:
                      continue
                  first = part.split("|")[0].strip()
                  first = first.split("(")[0].strip()
                  if first:
                      out.append(first)
              return out

          pkg_info = {}
          provides_map = defaultdict(list)
          for f in sorted(os.listdir(deb_dir)):
              if not f.endswith(".deb"):
                  continue
              path = os.path.join(deb_dir, f)
              name = dpkg_field(path, "Package")
              if not name:
                  continue
              arch = dpkg_field(path, "Architecture")
              depends_raw = dpkg_field(path, "Depends") or dpkg_field(path, "Pre-Depends")
              provides_raw = dpkg_field(path, "Provides")

              pkg_info[name] = {
                  "path": path,
                  "arch": arch,
                  "depends": parse_list(depends_raw),
                  "provides": parse_list(provides_raw),
              }
              for p in parse_list(provides_raw):
                  provides_map[p].append(name)

          needed, queue = set(), []
          for e in essentials:
              if e in pkg_info and e not in needed:
                  needed.add(e); queue.append(e)
              elif e in provides_map:
                  for real in provides_map[e]:
                      if real not in needed:
                          needed.add(real); queue.append(real)

          while queue:
              cur = queue.pop()
              info = pkg_info.get(cur)
              if not info:
                  continue
              for dep in info["depends"]:
                  targets = [dep] if dep in pkg_info else provides_map.get(dep, [])
                  for t in targets:
                      if t not in needed:
                          needed.add(t); queue.append(t)

          keep, skip_arch = [], []
          for name in sorted(needed):
              info = pkg_info[name]
              if info["arch"] == "all" or info["arch"] == ARCH:
                  keep.append(name)
              else:
                  skip_arch.append(f"{name}({info['arch']})")

          print(f">>> keeping {len(keep)} packages for arch {ARCH}")
          if skip_arch:
              print(f">>> skipped {len(skip_arch)} wrong-arch")

          missing = []
          for name in keep:
              for dep in pkg_info[name]["depends"]:
                  if dep not in pkg_info and dep not in provides_map:
                      missing.append(f"{name} -> {dep}")
          if missing:
              print(f">>> WARNING: {len(missing)} unresolvable dep(s):")
              for m in missing[:20]:
                  print(f"    {m}")

          with open("selected-packages.txt", "w") as fh:
              for name in keep:
                  fh.write(name + "\n")

          print(">>> sample:", ", ".join(keep[:20]))
          PYEOF

          python3 /tmp/resolve.py
          wc -l selected-packages.txt

      - name: Copy selected .deb files
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p debs
          rm -f debs/*.deb 2>/dev/null || true

          kept=0
          while read -r pkg; do
            [ -z "$pkg" ] && continue
            found=""
            for deb in all-debs/*.deb; do
              name=$(dpkg-deb -f "$deb" Package 2>/dev/null || echo "")
              arch=$(dpkg-deb -f "$deb" Architecture 2>/dev/null || echo "")
              if [ "$name" = "$pkg" ] && { [ "$arch" = "all" ] || [ "$arch" = "$ARCH" ]; }; then
                found="$deb"; break
              fi
            done
            if [ -n "$found" ]; then
              cp "$found" debs/
              kept=$((kept+1))
            fi
          done < selected-packages.txt

          echo ">>> copied $kept .deb files to debs/"
          du -sh debs

      - name: Extract into staging prefix
        run: |
          set -euo pipefail
          STAGING=staging
          rm -rf "$STAGING"
          mkdir -p "$STAGING"

          shopt -s nullglob
          for deb in debs/*.deb; do
            tmpdir=$(mktemp -d)
            dpkg-deb -x "$deb" "$tmpdir"
            prefix_dir="$tmpdir/data/data/app.xodos2/files/usr"
            if [ ! -d "$prefix_dir" ]; then
              prefix_dir="$tmpdir/data/data/com.termux/files/usr"
            fi
            if [ -d "$prefix_dir" ]; then
              cp -a "$prefix_dir/." "$STAGING/"
            fi
            rm -rf "$tmpdir"
          done
          shopt -u nullglob

          echo ">>> staging size: $(du -sh "$STAGING" | awk '{print $1}')"

      # ============================================================
      # sources.list → Hugging Face repos (main / x11 / root / glibc / tur)
      # ============================================================
      - name: Write sources.list
        run: |
          set -euo pipefail
          mkdir -p staging/etc/apt/sources.list.d
          rm -f staging/etc/apt/sources.list
          rm -f staging/etc/apt/sources.list.d/*.list 2>/dev/null || true

          {
            echo 'deb [trusted=yes] https://huggingface.co/datasets/xodiosx/xodos-packages/resolve/main/xodos-main stable main'
            echo 'deb [trusted=yes] https://huggingface.co/datasets/xodiosx/xodos-packages/resolve/main/xodos-x11 x11 main'
            echo 'deb [trusted=yes] https://huggingface.co/datasets/xodiosx/xodos-packages/resolve/main/xodos-root root stable'
            echo 'deb [trusted=yes] https://huggingface.co/datasets/xodiosx/xodos-packages/resolve/main/xodos-glibc glibc main'
            echo 'deb [trusted=yes] https://huggingface.co/datasets/xodiosx/xodos-packages/resolve/main/xodos-tur tur-packages tur tur-on-device tur-continuous'
          } > staging/etc/apt/sources.list

          echo ">>> sources.list:"
          cat staging/etc/apt/sources.list

      - name: Disable signature verification + strip keyring
        run: |
          set -euo pipefail
          rm -rf staging/etc/apt/trusted.gpg.d 2>/dev/null || true
          rm -rf staging/share/termux-keyring   2>/dev/null || true
          rm -rf staging/etc/termux-keyring     2>/dev/null || true

          mkdir -p staging/etc/apt/apt.conf.d
          {
            echo 'Acquire::AllowInsecureRepositories "true";'
            echo 'Acquire::AllowDowngradeToInsecureRepositories "true";'
            echo 'APT::Get::AllowUnauthenticated "true";'
          } > staging/etc/apt/apt.conf.d/99-insecure

      # ============================================================
      # Last-resort path fix in scripts (our build already renamed the prefix)
      # ============================================================
      - name: Fix lingering com.termux paths
        run: |
          set -euo pipefail
          mapfile -t files < <(grep -rl '/data/data/com\.termux' staging/ 2>/dev/null || true)
          if [ "${#files[@]}" -eq 0 ]; then
            echo ">>> no /data/data/com.termux references"
            exit 0
          fi
          for f in "${files[@]}"; do
            sed -i 's|/data/data/com\.termux|/data/data/app.xodos2|g' "$f"
          done

      - name: Create tar.xz
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          cd staging
          tar --numeric-owner -cJf "../bootstrap-${ARCH}.tar.xz" .
          cd ..
          ls -la "bootstrap-${ARCH}.tar.xz"
          echo ">>> compressed size: $(du -h "bootstrap-${ARCH}.tar.xz" | awk '{print $1}')"
          sha256sum "bootstrap-${ARCH}.tar.xz" > "bootstrap-${ARCH}.tar.xz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: bootstrap-${{ matrix.arch }}-${{ github.sha }}
          path: |
            bootstrap-*.tar.xz
            bootstrap-*.tar.xz.sha256

  publish:
    needs: [resolve, build]
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/download-artifact@v6
        with:
          merge-multiple: true
          path: ./

      - name: Create release
        id: tag
        run: |
          set -euo pipefail
          TAG="bootstrap-$(date -u +'%Y.%m.%d-%H%M%S')"
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "Bootstrap archives $TAG" \
            --notes "Prebuilt app.xodos2 bootstrap archives (plain .tar.xz).
          Extract directly into \$PREFIX.

          Includes only core utils + apt + dpkg + tar + shells + libs.
          Sources.list points to Hugging Face (xodos-main/x11/root/glibc/tur)." \
            --target "${{ github.sha }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Upload bootstrap archives
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          shopt -s nullglob
          files=(bootstrap-*.tar.xz bootstrap-*.tar.xz.sha256)
          for f in "${files[@]}"; do
            echo ">>> uploading $f"
            gh release upload "$TAG" "$f" --repo "${{ github.repository }}" --clobber
          done
          gh release view "$TAG" --repo "${{ github.repository }}" --json assets --jq '.assets[].name'
